<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCFAF6" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="宫花红">
<title>宫花红</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/diff-match-patch@1.0.5/index.min.js"></script>

<style>
@font-face {
  font-family: "汇文明朝体";
  src: url("./fonts/Huiwen-mincho.otf") format("opentype");
  font-display: swap;
}
*, *::before, *::after { box-sizing: border-box; }

:root {
  --bg: #FCFAF6;
  --bg-elev: #FFFFFF;
  --bg-sunken: #F4F1EA;
  --text: #222222;
  --text-2: #8C877D;
  --text-3: #B5AFA3;
  --line: #EAE5DB;
  --accent: #4A8B6F;
  --accent-soft: rgba(74,139,111,.12);
  --accent-strong: #3A7359;
  --danger: #C25B4E;
  --shadow: 0 8px 30px rgba(60,50,30,.13);
  --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC",
             "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --font-writer: "LXGW WenKai Screen", "LXGW WenKai", "汇文明朝体",
                 "Huiwen-Mincho", "Songti SC", "Source Han Serif SC",
                 "Noto Serif SC", serif;
  --font-note: "LXGW WenKai Screen", "LXGW WenKai", "宋体", SimSun, serif;
  --note-color: #8C877D;
  --writer-size: 19px;
  --writer-lh: 1.95;
  --writer-indent: 0em;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { height: 100%; margin: 0; }

body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  overscroll-behavior: none;
  transition: background .25s, color .25s;
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

button, input, textarea { font-family: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button { border: 0; background: transparent; cursor: pointer; }

.app { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
body.has-bg-image .app { background: transparent; }
body.has-bg-image .topbar,
body.has-bg-image .toolbar { background: rgba(255,255,255,.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
body.has-bg-image[data-theme="dark"] .topbar,
body.has-bg-image[data-theme="dark"] .toolbar { background: rgba(20,20,24,.6); }

.topbar {
  flex: 0 0 auto; height: 52px; padding: var(--safe-t) 4px 0;
  display: flex; align-items: center; gap: 2px;
  background: var(--bg); position: relative; z-index: 20;
}

.title-input {
  flex: 1 1 auto; min-width: 0; height: 40px;
  border: 0; outline: 0; background: transparent;
  font-family: var(--font-writer); font-size: 17px; font-weight: 500;
  text-align: center; color: var(--text);
  letter-spacing: .02em; padding: 0 6px; border-radius: 8px;
}
.title-input::placeholder { color: var(--text-3); font-weight: 400; }
.title-input:focus { background: rgba(255,255,255,.4); }

.icon-btn {
  flex: 0 0 auto; width: 40px; height: 40px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%; color: var(--text-2);
  transition: background .15s, color .15s;
}
.icon-btn:active { background: rgba(0,0,0,.05); }
.icon-btn svg { display: block; }

/* 模式切换按钮 */
.mode-btn {
  flex: 0 0 auto;
  height: 34px;
  padding: 0 14px;
  border-radius: 17px;
  background: var(--bg-sunken);
  color: var(--text-2);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: .3px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: background .15s, color .15s;
  white-space: nowrap;
}
.mode-btn:active { background: var(--line); }
.mode-btn.active { background: var(--accent-soft); color: var(--accent); }
.mode-btn svg { display: block; }

.peers { display: none; align-items: center; padding-right: 2px; flex: 0 0 auto; }
.peers.show { display: inline-flex; }
.peer-dot {
  width: 26px; height: 26px; border-radius: 50%; margin-left: -8px;
  border: 2px solid var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; color: #fff; user-select: none;
  position: relative;
  overflow: hidden;
}
.peer-dot:first-child { margin-left: 0; }
.peer-dot img { width: 100%; height: 100%; object-fit: cover; }
.peer-dot.typing::after {
  content: ""; position: absolute; right: -1px; bottom: -1px;
  width: 8px; height: 8px; border-radius: 50%;
  background: #5ac27a; border: 2px solid var(--bg);
  animation: pulse 1s ease-in-out infinite;
  z-index: 1;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

/* 我的头像按钮 */
.avatar {
  flex: 0 0 auto;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, #4285f4, #34a853);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-left: 4px;
  user-select: none;
  overflow: hidden;
  border: 0; cursor: pointer; padding: 0;
  font-family: inherit;
  transition: transform .12s, opacity .15s;
}
.avatar:active { transform: scale(.94); opacity: .85; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

.editor-wrap { flex: 1 1 auto; min-height: 0; position: relative; display: flex; justify-content: center; }

/* 编辑器 */
.editor {
  width: 100%; max-width: 760px; height: 100%;
  border: 0; outline: 0; resize: none;
  background: transparent;
  padding: 14px 22px 90px;
  font-family: var(--font-writer);
  font-size: var(--writer-size);
  line-height: var(--writer-lh);
  color: var(--text); letter-spacing: .02em;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  text-indent: var(--writer-indent);
  -webkit-user-select: text;
  user-select: text;
  -webkit-touch-callout: default;
  touch-action: manipulation;
}
.editor::placeholder { color: var(--text-3); font-size: .88em; line-height: 1.8; text-indent: 0; letter-spacing: 0; }
.editor::-webkit-scrollbar { width: 4px; }
.editor::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
.editor::-webkit-scrollbar-track { background: transparent; }

/* 阅读视图 */
.reader {
  display: none;
  width: 100%; max-width: 760px; height: 100%;
  padding: 20px 22px 90px;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  font-family: var(--font-writer);
  font-size: var(--writer-size);
  line-height: var(--writer-lh);
  color: var(--text);
  letter-spacing: .02em;
  word-wrap: break-word;
  overscroll-behavior: contain;
  -webkit-user-select: text;
  user-select: text;
}
.reader::-webkit-scrollbar { width: 4px; }
.reader::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
.reader::-webkit-scrollbar-track { background: transparent; }

body.reading-mode .editor { display: none; }
body.reading-mode .reader { display: block; }

.reader > *:first-child { margin-top: 0; }
.reader h1, .reader h2, .reader h3, .reader h4, .reader h5, .reader h6 {
  font-family: inherit; font-weight: 700;
  line-height: 1.45;
  margin: 1.5em 0 .6em;
  letter-spacing: .03em;
  text-indent: 0;
}
.reader h1 { font-size: 1.6em; }
.reader h2 { font-size: 1.36em; }
.reader h3 { font-size: 1.16em; }
.reader p { margin: 0 0 1em; text-indent: var(--writer-indent); }
.reader ul, .reader ol { margin: 0 0 1em; padding-left: 1.6em; }
.reader li { text-indent: 0; }
.reader blockquote {
  margin: 1em 0;
  padding: 4px 0 4px 16px;
  border-left: 3px solid var(--line);
  color: var(--text-2);
  text-indent: 0;
}
.reader code {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  background: var(--bg-sunken);
  padding: .15em .4em;
  border-radius: 4px;
  font-size: .86em;
}
.reader pre {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  background: var(--bg-sunken);
  border-radius: 10px;
  padding: 14px 16px;
  overflow-x: auto;
  font-size: .84em;
  line-height: 1.7;
  text-indent: 0;
}
.reader pre code { background: none; padding: 0; }
.reader hr { border: 0; border-top: 1px solid var(--line); margin: 1.8em 0; }
.reader a { color: var(--accent); }

/* 内联批注（比正文小一号） */
.inline-comment {
  margin: -0.2em 0 1.2em;
  padding: 10px 14px;
  border-left: 3px solid var(--accent);
  background: var(--accent-soft);
  border-radius: 8px;
  font-family: var(--font-note);
  font-size: 0.86em;
  line-height: 1.75;
  letter-spacing: .01em;
  text-indent: 0;
  color: var(--note-color);
}
.inline-comment .ic-head {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.86em;
  font-weight: 600;
  margin-bottom: 3px;
  opacity: .9;
}
.inline-comment .ic-avatar {
  width: 16px; height: 16px;
  border-radius: 50%;
  flex: 0 0 auto;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: #fff; font-weight: 600;
}
.inline-comment .ic-avatar img { width: 100%; height: 100%; object-fit: cover; }
.inline-comment .ic-body {
  white-space: pre-wrap;
  word-break: break-word;
}
.inline-comment.resolved { opacity: .45; }

.counter {
  position: absolute; right: 14px; bottom: 12px;
  font-size: 12px; color: var(--text-3);
  pointer-events: none;
  font-variant-numeric: tabular-nums; letter-spacing: .3px;
  padding: 2px 6px; border-radius: 8px; opacity: .9;
}
body.reading-mode .counter { display: none; }

.typing-banner {
  position: absolute; top: 8px; left: 50%;
  transform: translate(-50%, -6px);
  background: var(--accent); color: #fff;
  font-size: 12px; padding: 5px 14px; border-radius: 14px;
  opacity: 0; pointer-events: none;
  transition: opacity .22s, transform .22s;
  z-index: 15; white-space: nowrap;
  box-shadow: 0 2px 10px rgba(0,0,0,.16);
}
.typing-banner.show { opacity: 1; transform: translate(-50%, 0); }

.toolbar {
  flex: 0 0 auto; height: calc(58px + var(--safe-b));
  padding: 0 8px var(--safe-b);
  display: flex; align-items: center; justify-content: space-around;
  background: var(--bg); border-top: 1px solid var(--line);
  position: relative; z-index: 20;
}

.tool {
  flex: 1 1 0; min-width: 0; height: 52px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 2px; border-radius: 12px;
  color: var(--text-2); font-size: 10.5px; letter-spacing: .5px;
  transition: color .15s, background .15s; position: relative;
}
.tool:active { background: rgba(0,0,0,.05); }
.tool.on { color: var(--accent); }
.tool svg { display: block; }
.tool .badge {
  position: absolute; top: 5px; left: 50%; margin-left: 4px;
  min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px;
  background: var(--danger); color: #fff;
  font-size: 10px; line-height: 15px; text-align: center; font-weight: 600;
  font-style: normal;
}

.scrim {
  position: fixed; inset: 0; background: rgba(30,25,15,.38);
  opacity: 0; pointer-events: none; transition: opacity .24s;
  z-index: 60;
}
.scrim.show { opacity: 1; pointer-events: auto; }

.sheet {
  position: fixed; z-index: 61;
  left: 0; right: 0; bottom: 0;
  background: var(--bg-elev);
  border-radius: 20px 20px 0 0;
  box-shadow: var(--shadow);
  transform: translateY(102%);
  transition: transform .3s cubic-bezier(.32,.72,0,1);
  display: flex; flex-direction: column;
  max-height: 88dvh; padding-bottom: var(--safe-b);
  overflow: hidden; pointer-events: none;
}
.sheet.show { transform: translateY(0); pointer-events: auto; }
.sheet-grip { flex: 0 0 auto; padding: 9px 0 3px; display: flex; justify-content: center; }
.sheet-grip::after { content: ""; width: 36px; height: 4px; border-radius: 2px; background: var(--line); }
.sheet-head { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 6px 8px 10px 20px; }
.sheet-title { flex: 1 1 auto; font-size: 16px; font-weight: 600; letter-spacing: .3px; }
.sheet-sub { font-size: 12px; color: var(--text-3); margin-right: 4px; }
.sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 2px 16px 20px; overscroll-behavior: contain; }

@media (min-width: 720px) {
  .sheet {
    left: 50%; right: auto; bottom: auto; top: 50%;
    width: min(460px, calc(100vw - 48px));
    max-height: min(78vh, 720px); border-radius: 20px;
    transform: translate(-50%, -46%) scale(.97); opacity: 0;
    transition: opacity .22s, transform .22s;
  }
  .sheet.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  .sheet-grip { display: none; }
  .sheet-head { padding-top: 16px; }
}

.group { margin-bottom: 22px; }
.group:last-child { margin-bottom: 4px; }

.group-label {
  display: flex; align-items: baseline; justify-content: space-between;
  font-size: 12px; font-weight: 600; letter-spacing: 1px;
  color: var(--text-3); margin: 0 4px 10px;
}
.group-label .val { font-size: 13px; font-weight: 500; letter-spacing: 0; color: var(--accent); font-variant-numeric: tabular-nums; }

.font-list { display: flex; flex-direction: column; gap: 3px; }
.font-option {
  display: flex; align-items: center; gap: 12px;
  width: 100%; min-height: 56px; padding: 10px 12px;
  border: 1px solid transparent; border-radius: 12px;
  text-align: left; transition: background .15s, border-color .15s;
}
.font-option:active { background: var(--bg-sunken); }
.font-option.active { background: var(--accent-soft); border-color: rgba(74,139,111,.3); }
.fo-check {
  flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--text-3);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 11px; line-height: 1;
  transition: background .15s, border-color .15s;
}
.fo-check::after { content: "✓"; opacity: 0; transition: opacity .15s; }
.font-option.active .fo-check { background: var(--accent); border-color: var(--accent); }
.font-option.active .fo-check::after { opacity: 1; }
.fo-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.fo-name { font-size: 12px; color: var(--text-3); letter-spacing: .3px; }
.fo-sample { font-size: 18px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.chip-list { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 2px; }
.chip {
  height: 40px;
  padding: 0 16px;
  border-radius: 20px;
  background: var(--bg-sunken);
  color: var(--text);
  font-size: 15px;
  border: 2px solid transparent;
  transition: background .15s, border-color .15s;
  display: inline-flex; align-items: center; justify-content: center;
  white-space: nowrap;
}
.chip:active { background: var(--line); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.slider-row { display: flex; align-items: center; gap: 10px; padding: 0 2px; }
.step-btn {
  flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%;
  background: var(--bg-sunken); color: var(--text-2);
  display: flex; align-items: center; justify-content: center;
  font-family: Georgia, serif; transition: background .15s; user-select: none;
}
.step-btn:active { background: var(--line); }
.step-btn .s { font-size: 12px; }
.step-btn .l { font-size: 20px; }

input[type="range"].slider {
  flex: 1 1 auto; -webkit-appearance: none; appearance: none;
  height: 44px; background: transparent; margin: 0; cursor: pointer;
}
input[type="range"].slider::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type="range"].slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 22px; height: 22px; margin-top: -9px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--bg-elev);
  box-shadow: 0 1px 5px rgba(0,0,0,.25);
}
input[type="range"].slider::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
input[type="range"].slider::-moz-range-thumb {
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--bg-elev);
  box-shadow: 0 1px 5px rgba(0,0,0,.25);
}

.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 4px; }
.switch-label { font-size: 15px; }
.switch-label small { display: block; font-size: 12px; color: var(--text-3); margin-top: 2px; }
.switch {
  flex: 0 0 auto; position: relative; width: 50px; height: 30px;
  border-radius: 15px; background: var(--line); transition: background .2s;
}
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px;
  width: 24px; height: 24px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25);
  transition: transform .2s;
}
.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(20px); }

.swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 2px; }
.swatch {
  position: relative;
  height: 44px;
  border-radius: 10px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform .12s, border-color .15s, box-shadow .15s;
  overflow: hidden;
}
.swatch:active { transform: scale(.95); }
.swatch.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--bg-elev); }
.swatch-name {
  position: absolute;
  bottom: 3px; left: 4px; right: 4px;
  font-size: 10px;
  text-align: center;
  pointer-events: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: rgba(0,0,0,.6);
  text-shadow: 0 1px 2px rgba(255,255,255,.6);
}
.swatch.dark .swatch-name { color: rgba(255,255,255,.75); text-shadow: 0 1px 2px rgba(0,0,0,.5); }

.bg-tools { display: flex; gap: 8px; margin-top: 10px; }
.bg-tools button {
  flex: 1; height: 42px;
  border-radius: 10px;
  background: var(--bg-sunken);
  color: var(--text);
  font-size: 14px;
  transition: background .15s;
}
.bg-tools button:active { background: var(--line); }

.try-box {
  border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 18px;
  font-family: var(--font-writer);
  font-size: var(--writer-size); line-height: var(--writer-lh);
  text-indent: var(--writer-indent);
  color: var(--text); word-break: break-all;
}

.big-btn {
  width: 100%; height: 50px; border-radius: 14px;
  background: var(--accent); color: #fff;
  font-size: 16px; font-weight: 500;
  display: flex; align-items: center; justify-content: center;
  gap: 8px; transition: background .15s;
}
.big-btn:active { background: var(--accent-strong); }
.big-btn.ghost { background: var(--bg-sunken); color: var(--text); }

.comment-list { display: flex; flex-direction: column; gap: 10px; }
.comment { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; transition: opacity .2s; }
.comment.resolved { opacity: .5; }
.comment-quote {
  font-family: var(--font-writer); font-size: 14px; line-height: 1.6;
  color: var(--text-2); border-left: 3px solid var(--line);
  padding-left: 10px; margin-bottom: 8px; max-height: 3.2em; overflow: hidden;
}
.comment-text { font-size: 15px; line-height: 1.65; color: var(--text); white-space: pre-wrap; word-break: break-word; }
.comment-meta { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--text-3); flex-wrap: wrap; }
.comment-meta .who { font-weight: 600; }
.comment-meta .sp { flex: 1 1 auto; }

.mini-btn { height: 30px; padding: 0 10px; border-radius: 15px; font-size: 12.5px; color: var(--accent); transition: background .15s; }
.mini-btn:active { background: var(--accent-soft); }
.mini-btn.danger { color: var(--danger); }
.mini-btn.danger:active { background: rgba(194,91,78,.1); }

.empty-tip { text-align: center; color: var(--text-3); font-size: 14px; line-height: 1.9; padding: 34px 20px; }

.composer { border: 1px solid var(--accent); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
.composer .quote {
  font-family: var(--font-writer); font-size: 14px; line-height: 1.6;
  color: var(--text-2); border-left: 3px solid var(--accent);
  padding-left: 10px; margin-bottom: 10px; max-height: 4em; overflow: hidden;
}
.composer textarea {
  width: 100%; min-height: 66px; border: 0; outline: 0; resize: none;
  background: transparent; font-size: 15px; line-height: 1.65; color: var(--text);
}
.composer textarea::placeholder { color: var(--text-3); }
.composer-actions { display: flex; justify-content: flex-end; gap: 4px; margin-top: 6px; }

.share-status { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 14px; background: var(--bg-sunken); margin-bottom: 16px; }
.share-status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--text-3); flex: 0 0 auto; }
.share-status.online .dot { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.share-status .txt { flex: 1 1 auto; font-size: 14px; line-height: 1.5; }
.share-status .txt small { display: block; color: var(--text-3); font-size: 12px; margin-top: 2px; }

.link-box { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 14px; margin-bottom: 14px; }
.link-box input { flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 13.5px; color: var(--text-2); font-family: ui-monospace, Menlo, Consolas, monospace; text-overflow: ellipsis; }
.link-box .copy { flex: 0 0 auto; height: 38px; padding: 0 16px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 14px; font-weight: 500; }
.link-box .copy:active { background: var(--accent-strong); }

.hint { font-size: 12.5px; line-height: 1.8; color: var(--text-3); margin-top: 14px; padding: 0 2px; }
.hint code { font-family: ui-monospace, Menlo, Consolas, monospace; background: var(--bg-sunken); padding: 1px 5px; border-radius: 5px; font-size: 12px; color: var(--text-2); }

.menu-list { display: flex; flex-direction: column; gap: 2px; }
.menu-item {
  display: flex; align-items: center; gap: 14px;
  width: 100%; min-height: 54px; padding: 0 12px;
  border-radius: 12px; text-align: left;
  font-size: 15.5px; color: var(--text);
  transition: background .15s;
}
.menu-item:active { background: var(--bg-sunken); }
.menu-item svg { flex: 0 0 auto; color: var(--text-2); }
.menu-item.danger { color: var(--danger); }
.menu-item.danger svg { color: var(--danger); }

.avatar-edit { display: flex; align-items: center; gap: 16px; padding: 4px; }
.avatar-preview {
  width: 68px; height: 68px;
  border-radius: 50%;
  background: var(--bg-sunken);
  color: var(--text-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 600;
  overflow: hidden;
  flex: 0 0 auto;
  font-family: var(--font-writer);
}
.avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
.avatar-actions { display: flex; flex-direction: column; gap: 8px; flex: 1 1 auto; }
.avatar-actions button {
  height: 38px;
  padding: 0 14px;
  border-radius: 9px;
  background: var(--bg-sunken);
  color: var(--text);
  font-size: 14px;
  transition: background .15s;
}
.avatar-actions button:active { background: var(--line); }
.avatar-actions .danger { color: var(--danger); }

.text-input {
  width: 100%;
  height: 48px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0 14px;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  outline: 0;
  transition: border-color .15s;
}
.text-input:focus { border-color: var(--accent); }
.text-input::placeholder { color: var(--text-3); }

.toast {
  position: fixed; left: 50%; bottom: calc(84px + var(--safe-b));
  transform: translate(-50%, 14px);
  background: rgba(38,34,26,.93); color: #fff;
  font-size: 14px; line-height: 1.5; padding: 11px 20px;

}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 420px) {
  .editor, .reader { padding: 12px 18px 90px; }
  .counter { right: 10px; }
}

  function getFont(id) {
    for (var i = 0; i < FONTS.length; i++) if (FONTS[i].id === id) return FONTS[i];
    return FONTS[0];
  }
  function getNoteFont(id) {
    for (var i = 0; i < NOTE_FONTS.length; i++) if (NOTE_FONTS[i].id === id) return NOTE_FONTS[i];
    return NOTE_FONTS[0];
  }

  function hex2rgb(h) {
    var m = String(h).match(/^#?([0-9a-f]{6})$/i);
    if (!m) return null;
    var n = parseInt(m[1], 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgb2hex(r, g, b) {
    var p = function (v) { v = Math.max(0, Math.min(255, Math.round(v))); return (v < 16 ? '0' : '') + v.toString(16); };
    return '#' + p(r) + p(g) + p(b);
  }
  function mix(a, b, t) {
    var x = hex2rgb(a), y = hex2rgb(b);
    if (!x || !y) return a;
    return rgb2hex(x[0] + (y[0] - x[0]) * t, x[1] + (y[1] - x[1]) * t, x[2] + (y[2] - x[2]) * t);
  }
  function luminance(h) {
    var c = hex2rgb(h); if (!c) return 1;
    return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
  }
  function isDark(h) { return luminance(h) < 0.42; }

  function loadTypo() {
    try {
      var raw = localStorage.getItem(TYPO_KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (!o || typeof o !== 'object') return;
      if (o.font && getFont(o.font).id === o.font) typo.font = o.font;
      var s = parseInt(o.size, 10);
      if (!isNaN(s)) typo.size = Math.min(MAX_SIZE, Math.max(MIN_SIZE, s));
      var l = parseFloat(o.lh);
      if (!isNaN(l)) typo.lh = Math.min(2.8, Math.max(1.4, l));
      typo.indent = !!o.indent;
      if (/^#[0-9a-f]{6}$/i.test(o.bg)) typo.bg = o.bg;
      if (/^#[0-9a-f]{6}$/i.test(o.fg)) typo.fg = o.fg;
      if (typeof o.bgImage === 'string') typo.bgImage = o.bgImage;
      var v = parseInt(o.bgVeil, 10);
      if (!isNaN(v)) typo.bgVeil = Math.min(90, Math.max(0, v));
      if (o.noteFont && getNoteFont(o.noteFont).id === o.noteFont) typo.noteFont = o.noteFont;
      if (/^#[0-9a-f]{6}$/i.test(o.noteColor)) typo.noteColor = o.noteColor;
    } catch (e) {}
  }

    try { localStorage.setItem(TYPO_KEY, JSON.stringify(typo)); } catch (e) {}
  }

  function applyTypo() {
    var f = getFont(typo.font);
    var nf = getNoteFont(typo.noteFont);
    var r = document.documentElement;
    r.style.setProperty('--font-writer', f.stack);
    r.style.setProperty('--font-note', nf.stack);

    r.style.setProperty('--writer-size', typo.size + 'px');
    r.style.setProperty('--writer-lh', typo.lh);
    r.style.setProperty('--writer-indent', typo.indent ? '2em' : '0em');

    var bg = typo.bg, fg = typo.fg;
    var dark = isDark(bg);
    r.style.setProperty('--bg', bg);
    r.style.setProperty('--text', fg);
    r.setAttribute('data-theme', dark ? 'dark' : 'light');

    if (dark) {
      r.style.setProperty('--bg-elev', mix(bg, '#FFFFFF', 0.08));
      r.style.setProperty('--bg-sunken', mix(bg, '#FFFFFF', 0.04));
      r.style.setProperty('--line', mix(bg, '#FFFFFF', 0.16));
      r.style.setProperty('--text-2', mix(fg, bg, 0.4));
      r.style.setProperty('--text-3', mix(fg, bg, 0.68));
      r.style.setProperty('--accent', '#7CC4A0');
      r.style.setProperty('--accent-strong', '#96D6B4');
      r.style.setProperty('--accent-soft', 'rgba(124,196,160,.18)');
    } else {
      r.style.setProperty('--bg-elev', '#FFFFFF');
      r.style.setProperty('--bg-sunken', mix(bg, '#000000', 0.05));
      r.style.setProperty('--line', mix(bg, '#000000', 0.1));
      r.style.setProperty('--text-2', mix(fg, bg, 0.42));
      r.style.setProperty('--text-3', mix(fg, bg, 0.66));
      r.style.setProperty('--accent', '#4A8B6F');
      r.style.setProperty('--accent-strong', '#3A7359');
      r.style.setProperty('--accent-soft', 'rgba(74,139,111,.12)');
    }
    themeColor.setAttribute('content', bg);

    if (typo.bgImage) {
      var veil = (typo.bgVeil || 0) / 100;
      var rgb = hex2rgb(bg) || [252, 250, 246];
      var rgba = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + veil + ')';

      document.body.style.backgroundSize = 'cover';

    swIndent.classList.toggle('on', typo.indent);
    swIndent.setAttribute('aria-checked', typo.indent ? 'true' : 'false');

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function stamp() {
    var d = new Date();
    return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes());
  }
  function randId(n) {
    var c = 'abcdefghijkmnpqrstuvwxyz23456789', s = '';
    for (var i = 0; i < n; i++) s += c.charAt(Math.floor(Math.random() * c.length));
    return s;
  }

  function copyToClipboard(text, okMsg, errMsg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(
        function () { if (okMsg) toast(okMsg); },
        function () { legacyCopy(text, okMsg, errMsg); }
      );
    }
    legacyCopy(text, okMsg, errMsg);
  }
  function legacyCopy(text, okMsg, errMsg) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
    ta.setAttribute('readonly', '');
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? (okMsg || '已复制') : (errMsg || '复制失败'));
  }

  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/__([^_]+)__/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/_([^_]+)_/g, '<em>$1</em>')
      .replace(/~~([^~]+)~~/g, '<del>$1</del>')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }

  function md(src) {
    var lines = String(src).split(/\r?\n/);
    var out = '', inCode = false, buf = [], list = null;
    function closeList() { if (list) { out += '</' + list + '>'; list = null; } }
    for (var i = 0; i < lines.length; i++) {
      var L = lines[i], m;
      if (/^\s*```/.test(L)) {
        if (inCode) { out += '<pre><code>' + esc(buf.join('\n')) + '</code></pre>'; buf = []; inCode = false; }
        else { closeList(); inCode = true; }
        continue;
      }
      if (inCode) { buf.push(L); continue; }
      if (!L.trim()) { closeList(); continue; }
      m = L.match(/^(#{1,6})\s+(.*)$/);
      if (m) { closeList(); var h = m[1].length; out += '<h' + h + '>' + inline(m[2]) + '</h' + h + '>'; continue; }
      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(L)) { closeList(); out += '<hr>'; continue; }
      m = L.match(/^\s*[-*+]\s+(.*)$/);
      if (m) { if (list !== 'ul') { closeList(); out += '<ul>'; list = 'ul'; } out += '<li>' + inline(m[1]) + '</li>'; continue; }
      m = L.match(/^\s*\d+[.)]\s+(.*)$/);
      if (m) { if (list !== 'ol') { closeList(); out += '<ol>'; list = 'ol'; } out += '<li>' + inline(m[1]) + '</li>'; continue; }
      m = L.match(/^\s*>\s?(.*)$/);
      if (m) { closeList(); out += '<blockquote>' + inline(m[1]) + '</blockquote>'; continue; }
      closeList();
      out += '<p>' + inline(L) + '</p>';
    }
    if (inCode) out += '<pre><code>' + esc(buf.join('\n')) + '</code></pre>';
    closeList();
    return out;
  }

  /* ============================================================
     渲染阅读视图（含内联批注）
     ============================================================ */
  function renderReader() {
    if (!isReading) return;

    var html = md(editor.value);
    reader.innerHTML = html || '<p style="color:var(--text-3);text-indent:0">还没有内容。</p>';

    if (!state.comments.length) return;

    /* 每个批注找它 quote 第一次出现的顶层块，插到那个块后面 */
    var blocks = Array.prototype.slice.call(reader.children);
    var consumed = [];

    state.comments.forEach(function (c) {
      if (!c.quote || !c.quote.trim()) return;
      var q = c.quote;

      for (var i = 0; i < blocks.length; i++) {
        if (consumed.indexOf(blocks[i]) !== -1) continue;
        var b = blocks[i];
        var txt = b.textContent || '';
        if (txt.indexOf(q) !== -1) {
          var node = buildInlineComment(c);
          if (b.nextSibling) reader.insertBefore(node, b.nextSibling);
          else reader.appendChild(node);
          consumed.push(b);
          return;
        }
      }

      /* 找不到对应块 → 追加在末尾 */
      reader.appendChild(buildInlineComment(c));
    });
  }

  function buildInlineComment(c) {
    var box = document.createElement('div');
    box.className = 'inline-comment' + (c.resolved ? ' resolved' : '');

    var head = document.createElement('div');
    head.className = 'ic-head';

    var av = document.createElement('span');
    av.className = 'ic-avatar';
    if (c.avatar) {
      var img = document.createElement('img');
      img.src = c.avatar;
      av.appendChild(img);
    } else {
      av.style.background = pickColor(c.clientId || c.author || 'x');
      av.textContent = (c.author || '匿').trim().charAt(0).toUpperCase();
    }

    var nm = document.createElement('span');
    nm.textContent = c.author || '匿名';

    head.appendChild(av);
    head.appendChild(nm);

    if (c.resolved) {
      var tag = document.createElement('span');
      tag.style.marginLeft = '4px';
      tag.style.fontWeight = '400';
      tag.style.opacity = '.7';
      tag.textContent = '· 已解决';
      head.appendChild(tag);
    }

    var body = document.createElement('div');
    body.className = 'ic-body';
    body.textContent = c.text || '';

    box.appendChild(head);
    box.appendChild(body);
    return box;
  }

  /* ============================================================

  var collab = { ws: null, bc: null, local: false, ready: false, suppress: false,
                 pushTimer: null, reconnectTimer: null, retry: 0, typingTimer: null };
  var COLORS = ['#4A8B6F','#C2873F','#5B7FBF','#B3618A','#8A7BC8','#4F9BA8','#C2604F','#7E9B4A'];

  function pickColor(id) {
    var h = 0;
    for (var i = 0; i < String(id).length; i++) h = (h * 31 + String(id).charCodeAt(i)) >>> 0;
    return COLORS[h % COLORS.length];
  }

  function initSelf() {
    var id;
    try {
      id = localStorage.getItem(CLIENT_KEY);
      if (!id) { id = randId(8); localStorage.setItem(CLIENT_KEY, id); }
    } catch (e) { id = randId(8); }
    state.selfId = id;
    state.selfColor = pickColor(id);
    state.selfName = user.name || ('访客' + id.slice(-3).toUpperCase());
  }

  function updateSelfName() {
    state.selfName = user.name || ('访客' + state.selfId.slice(-3).toUpperCase());
    if (collab.ready) {
      sendToRoom({ type: 'name', name: state.selfName, avatar: user.avatar || '' });
    }
  }

  function sendToRoom(payload) {
    if (collab.local) {
      if (collab.bc) collab.bc.postMessage(Object.assign({ from: state.selfId }, payload));
      return true;
    }
    if (collab.ws && collab.ws.readyState === 1) {
      collab.ws.send(JSON.stringify(payload));
      return true;
    }
    return false;
  }

  function pushContent() {
    if (!collab.ready) return;
    if (lastSyncedText === editor.value) return;
    try {
      var dmp = new diff_match_patch();
      var patches = dmp.patch_make(lastSyncedText, editor.value);
      if (!patches.length) { lastSyncedText = editor.value; return; }
      var patchText = dmp.patch_toText(patches);
      lastSyncedText = editor.value;
      sendToRoom({ type: 'op', patch: patchText });
    } catch (e) {}
  }

  function pushTitle() {
    if (!collab.ready) return;
    sendToRoom({ type: 'title', title: titleInput.value });
  }

  function schedulePush() {
    if (!collab.ready) return;
    clearTimeout(collab.pushTimer);
    collab.pushTimer = setTimeout(pushContent, 260);
  }

  function notifyTyping() {
    if (!collab.ready) return;
    if (!state.selfTyping) {
      state.selfTyping = true;
      sendToRoom({ type: 'typing', active: true });
    }
    clearTimeout(collab.typingTimer);
    collab.typingTimer = setTimeout(function () {
      state.selfTyping = false;
      sendToRoom({ type: 'typing', active: false });
      pushContent();
    }, 1200);
  }

  function applyRemotePatch(patchText) {
    if (!patchText) return;
    try {
      var dmp = new diff_match_patch();
      var patches = dmp.patch_fromText(patchText);
      var oldText = editor.value;
      var pos = editor.selectionStart;
      var posEnd = editor.selectionEnd;

      var offset = 0, offsetEnd = 0;
      for (var i = 0; i < patches.length; i++) {
        var p = patches[i];
        var ps = p.start1, pe = p.start1 + p.length1;
        var d = p.length2 - p.length1;
        if (pos >= pe) offset += d;
        else if (pos > ps) offset += (p.start1 + p.length2 - pos);
        if (posEnd >= pe) offsetEnd += d;
        else if (posEnd > ps) offsetEnd += (p.start1 + p.length2 - posEnd);
      }

      var result = dmp.patch_apply(patches, oldText);
      var newText = result[0];
      var focused = document.activeElement === editor;

      editor.value = newText;
      lastSyncedText = newText;

      if (focused) {
        var np = Math.max(0, Math.min(newText.length, pos + offset));
        var npe = Math.max(np, Math.min(newText.length, posEnd + offsetEnd));
        try { editor.setSelectionRange(np, npe); } catch (e) {}
      }

      countText();
      persistLocal();
      if (isReading) renderReader();
    } catch (e) {}
  }

  function updateTypingBanner() {
    var othersTyping = false, name = '';
    for (var i = 0; i < state.peers.length; i++) {
      var p = state.peers[i];
      if (p.id !== state.selfId && p.typing) { othersTyping = true; name = p.name || ''; break; }
    }
    if (othersTyping) {
      typingBanner.textContent = '✎ ' + (name || '对方') + ' 正在输入…';
      typingBanner.classList.add('show');
    } else {
      typingBanner.classList.remove('show');
    }
  }

  function handleMessage(msg) {
    if (!msg || typeof msg !== 'object') return;

    if (msg.type === 'init') {
      collab.ready = true;
      state.selfId = msg.clientId || state.selfId;
      state.selfColor = pickColor(state.selfId);
      state.selfName = user.name || msg.selfName || state.selfName;

      var sc = (msg.doc && typeof msg.doc.content === 'string') ? msg.doc.content : '';
      var st = (msg.doc && typeof msg.doc.title === 'string') ? msg.doc.title : '';
      var sCm = (msg.doc && Array.isArray(msg.doc.comments)) ? msg.doc.comments : [];

      if (sc || st) {
        collab.suppress = true;
        titleInput.value = st;
        editor.value = sc;
        lastSyncedText = sc;
        state.comments = sCm;
        collab.suppress = false;
        countText();
        renderComments();
        if (isReading) renderReader();
      } else if (editor.value || titleInput.value) {
        lastSyncedText = '';
        setTimeout(pushContent, 80);
        setTimeout(pushTitle, 150);
      } else {
        lastSyncedText = '';
      }

      /* 广播一次我的名字和头像 */
      setTimeout(function () {
        sendToRoom({ type: 'name', name: state.selfName, avatar: user.avatar || '' });
      }, 200);

      if (Array.isArray(msg.peers)) { state.peers = msg.peers; renderPeers(); updateTypingBanner(); }
      updateSharePanel();
      return;
    }

    if (msg.type === 'op') {
      if (msg.from === state.selfId || collab.suppress) return;
      applyRemotePatch(String(msg.patch || ''));
      return;
    }

    if (msg.type === 'resync') {
      var resyncText = String(msg.content || '');
      editor.value = resyncText;
      lastSyncedText = resyncText;
      countText();
      if (isReading) renderReader();
      return;
    }

    if (msg.type === 'name') {
      for (var n = 0; n < state.peers.length; n++) {
        if (state.peers[n].id === msg.from) {
          state.peers[n].name = String(msg.name || state.peers[n].name || '');
          state.peers[n].avatar = String(msg.avatar || '');
        }
      }
      renderPeers(); updateTypingBanner();
      return;
    }

    if (msg.type === 'title') {
      if (msg.from === state.selfId || collab.suppress) return;
      var t = String(msg.title || '');
      if (t !== titleInput.value && document.activeElement !== titleInput) titleInput.value = t;
      return;
    }

    if (msg.type === 'typing') {
      if (collab.local) {
        for (var k = 0; k < state.peers.length; k++) {
          if (state.peers[k].id === msg.from) state.peers[k].typing = !!msg.active;
        }
        renderPeers();
        updateTypingBanner();
      }
      return;
    }

    if (msg.type === 'peers') {
      state.peers = Array.isArray(msg.peers) ? msg.peers : [];
      renderPeers(); updateTypingBanner(); updateSharePanel();
      return;
    }

    if (msg.type === 'comment:add' && msg.comment) {
      var exist = false;
      for (var i = 0; i < state.comments.length; i++)
        if (state.comments[i].id === msg.comment.id) { exist = true; break; }
      if (!exist) state.comments.push(msg.comment);
      renderComments();
      if (isReading) renderReader();
      if (msg.comment.clientId !== state.selfId) toast((msg.comment.author || '有人') + ' 添加了一条批注');
      return;
    }
    if (msg.type === 'comment:update' && msg.comment) {
      for (var j = 0; j < state.comments.length; j++)
        if (state.comments[j].id === msg.comment.id) { state.comments[j] = msg.comment; break; }
      renderComments();
      if (isReading) renderReader();
      return;
    }
    if (msg.type === 'comment:delete') {
      state.comments = state.comments.filter(function (c) { return c.id !== msg.id; });
      renderComments();
      if (isReading) renderReader();
      return;
    }
  }

  function connectLocal(room) {
    if (typeof BroadcastChannel === 'undefined') { toast('当前浏览器不支持本地协作'); return; }
    collab.local = true;
    try { collab.bc = new BroadcastChannel('writer-room-' + room); }
    catch (e) { toast('无法建立本地协作通道'); return; }

    collab.bc.onmessage = function (e) {
      var msg = e.data;
      if (!msg || msg.from === state.selfId) return;
      if (msg.type === 'hello') {
        collab.bc.postMessage({ type: 'sync-all', content: editor.value, title: titleInput.value, comments: state.comments, from: state.selfId });
        return;
      }
      if (msg.type === 'sync-all') {
        if (!editor.value) {
          editor.value = String(msg.content || '');
          lastSyncedText = editor.value;
          if (msg.title) titleInput.value = msg.title;
          if (Array.isArray(msg.comments)) state.comments = msg.comments;
          countText();
          renderComments();
        }
        return;
      }
      handleMessage(msg);
    };

    collab.ready = true;
    lastSyncedText = editor.value;
    collab.bc.postMessage({ type: 'hello', from: state.selfId });
    state.peers = [{ id: state.selfId, name: state.selfName + '（本机）', typing: false }];
    renderPeers(); updateSharePanel();
  }

  function connectServer(room) {
    var base = CONFIG.SERVER.replace(/\/+$/, '');
    var wsUrl = base.replace(/^http/, 'ws') + '/ws?room=' + encodeURIComponent(room) + '&name=' + encodeURIComponent(state.selfName);
    collab.local = false;
    var ws;
    try { ws = new WebSocket(wsUrl); } catch (e) { toast('无法连接协作服务器'); return; }
    collab.ws = ws;

    ws.onopen = function () { collab.retry = 0; state.online = true; updateSharePanel(); renderPeers(); };

    ws.onmessage = function (e) {
      var msg; try { msg = JSON.parse(e.data); } catch (err) { return; }
      handleMessage(msg);
    };

    ws.onclose = function () {
      collab.ready = false; state.online = false; updateSharePanel();
      state.peers = [];
      renderPeers(); updateTypingBanner();
      if (state.room && collab.retry < 6) {
        collab.retry++;
        clearTimeout(collab.reconnectTimer);
        collab.reconnectTimer = setTimeout(function () { if (state.room) connectServer(state.room); }, 1200 * collab.retry);
      }
    };
    ws.onerror = function () {};
  }

  function connectRoom(room) {
    disconnectRoom(true);
    state.room = room;
    if (CONFIG.SERVER) connectServer(room); else connectLocal(room);
  }

  function disconnectRoom(silent) {
    if (collab.bc) { try { collab.bc.close(); } catch (e) {} collab.bc = null; }
    if (collab.ws) { try { collab.ws.close(); } catch (e) {} collab.ws = null; }
    clearTimeout(collab.reconnectTimer);
    clearTimeout(collab.typingTimer);
    state.selfTyping = false;
    collab.ready = false;
    state.online = false;
    if (!silent) { state.room = ''; state.peers = []; renderPeers(); updateTypingBanner(); }
  }

  function renderPeers() {
    var list = state.peers || [];
    if (!state.room || list.length === 0) { peersEl.classList.remove('show'); peersEl.innerHTML = ''; return; }
    peersEl.innerHTML = '';
    list.slice(0, 4).forEach(function (p) {
      var d = document.createElement('span');
      d.className = 'peer-dot' + (p.id !== state.selfId && p.typing ? ' typing' : '');
      if (p.avatar) {
        var img = document.createElement('img');
        img.src = p.avatar;
        img.alt = '';
        d.appendChild(img);
      } else {
        d.style.background = pickColor(p.id || 'x');
        d.textContent = (p.name || '?').trim().charAt(0).toUpperCase();
      }
      d.title = (p.name || '') + (p.typing ? '（正在输入）' : '');
      peersEl.appendChild(d);
    });
    if (list.length > 4) {
      var more = document.createElement('span');
      more.className = 'peer-dot';
      more.style.background = '#8C877D';
      more.textContent = '+' + (list.length - 4);
      peersEl.appendChild(more);
    }
    peersEl.classList.add('show');
  }

  /* ============================================================
     批注
     ============================================================ */
  function sendComment(quote, text) {
    var payload = { type: 'comment:add', comment: {
      quote: quote, text: text, name: state.selfName, avatar: user.avatar || ''
    }};
    if (!collab.ready) {
      state.comments.push({
        id: randId(10), quote: quote, text: text, author: state.selfName,
        avatar: user.avatar || '',
        clientId: state.selfId, resolved: false, createdAt: Date.now()
      });
      renderComments();
      if (isReading) renderReader();
      toast('已添加批注（本地）');
      return;
    }
    sendToRoom(payload);
  }

  function resolveComment(id, resolved) {
    var payload = { type: 'comment:resolve', id: id, resolved: resolved };
    if (collab.local) sendToRoom(payload);
    else if (collab.ws && collab.ws.readyState === 1) { sendToRoom(payload); return; }
    for (var i = 0; i < state.comments.length; i++)
      if (state.comments[i].id === id) { state.comments[i].resolved = resolved; break; }
    renderComments();
    if (isReading) renderReader();
  }

  function deleteComment(id) {
    var payload = { type: 'comment:delete', id: id };
    if (collab.local) sendToRoom(payload);
    else if (collab.ws && collab.ws.readyState === 1) { sendToRoom(payload); return; }
    state.comments = state.comments.filter(function (c) { return c.id !== id; });
    renderComments();
    if (isReading) renderReader();
  }

  function fmtTime(ts) {
    if (!ts) return '';
    var d = new Date(ts), now = new Date();
    if (d.toDateString() === now.toDateString()) return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function renderComments() {
    var open = state.comments.filter(function (c) { return !c.resolved; });
    commentCount.textContent = state.comments.length ? open.length + ' 待处理 / 共 ' + state.comments.length + ' 条' : '';
    if (open.length > 0) { commentBadge.textContent = open.length > 99 ? '99+' : open.length; commentBadge.style.display = ''; }
    else { commentBadge.style.display = 'none'; }
    commentList.innerHTML = '';

    if (!state.comments.length) {
      var tip = document.createElement('div');
      tip.className = 'empty-tip';
      tip.textContent = '还没有批注。在正文中选中一段文字，然后点「批注」即可添加。';
      commentList.appendChild(tip);
      return;
    }

    var sorted = state.comments.slice().sort(function (a, b) {
      if (!!a.resolved !== !!b.resolved) return a.resolved ? 1 : -1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });

    sorted.forEach(function (c) {
      var box = document.createElement('div');
      box.className = 'comment' + (c.resolved ? ' resolved' : '');
      var quote = document.createElement('div'); quote.className = 'comment-quote'; quote.textContent = c.quote || '（全文）';
      var text = document.createElement('div'); text.className = 'comment-text'; text.textContent = c.text || '';
      var meta = document.createElement('div'); meta.className = 'comment-meta';
      var who = document.createElement('span'); who.className = 'who';
      who.style.color = pickColor(c.clientId || c.author || 'x');
      who.textContent = c.author || '匿名';
      var tm = document.createElement('span'); tm.textContent = fmtTime(c.createdAt);
      var sp = document.createElement('span'); sp.className = 'sp';
      meta.appendChild(who); meta.appendChild(tm); meta.appendChild(sp);

      if (c.quote) {
        var goBtn = document.createElement('button');
        goBtn.type = 'button'; goBtn.className = 'mini-btn'; goBtn.textContent = '定位';
        goBtn.addEventListener('click', function () {
          if (isReading) {
            /* 阅读模式：滚动到对应批注 */
            var nodes = reader.querySelectorAll('.inline-comment');
            var idx = state.comments.indexOf(c);
            if (idx >= 0 && nodes[idx]) {
              closeSheet();
              nodes[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
              nodes[idx].style.transition = 'background .3s';
              var orig = nodes[idx].style.background;
              nodes[idx].style.background = 'rgba(74,139,111,.28)';
              setTimeout(function () { nodes[idx].style.background = orig; }, 900);
            }
            return;
          }
          var i = editor.value.indexOf(c.quote);
          if (i < 0) { toast('原文已被修改，无法定位'); return; }
          skipFocusToEnd = true;
          closeSheet();
          editor.focus();
          editor.setSelectionRange(i, i + c.quote.length);
          var ratio = i / Math.max(1, editor.value.length);
          editor.scrollTop = ratio * (editor.scrollHeight - editor.clientHeight);
          setTimeout(function () { skipFocusToEnd = false; }, 400);
        });
        meta.appendChild(goBtn);
      }

      var rBtn = document.createElement('button');
      rBtn.type = 'button'; rBtn.className = 'mini-btn';
      rBtn.textContent = c.resolved ? '重新打开' : '标记已解决';
      rBtn.addEventListener('click', function () { resolveComment(c.id, !c.resolved); });
      meta.appendChild(rBtn);

      if (c.clientId === state.selfId) {
        var dBtn = document.createElement('button');
        dBtn.type = 'button'; dBtn.className = 'mini-btn danger'; dBtn.textContent = '删除';
        dBtn.addEventListener('click', function () { if (confirm('删除这条批注？')) deleteComment(c.id); });
        meta.appendChild(dBtn);
      }

      box.appendChild(quote); box.appendChild(text); box.appendChild(meta);
      commentList.appendChild(box);
    });
  }

  function openCommentSheet() {
    composerSlot.innerHTML = '';
    var sel = '', start = -1, end = -1;

    if (document.activeElement === editor && editor.selectionStart !== editor.selectionEnd) {
      start = editor.selectionStart; end = editor.selectionEnd;
      sel = editor.value.substring(start, end);
    } else if (state.lastSel && state.lastSel.start !== state.lastSel.end) {
      start = state.lastSel.start; end = state.lastSel.end;
      if (start >= 0 && end <= editor.value.length) sel = editor.value.substring(start, end);
    }

    if (sel && sel.trim()) {
      var box = document.createElement('div'); box.className = 'composer';
      var q = document.createElement('div'); q.className = 'quote';
      q.textContent = sel.length > 140 ? sel.slice(0, 140) + '…' : sel;
      var ta = document.createElement('textarea'); ta.placeholder = '写下你的批注…';
      var actions = document.createElement('div'); actions.className = 'composer-actions';
      var cancel = document.createElement('button'); cancel.type = 'button'; cancel.className = 'mini-btn'; cancel.textContent = '取消';
      cancel.addEventListener('click', function () { composerSlot.innerHTML = ''; });
      var send = document.createElement('button'); send.type = 'button'; send.className = 'mini-btn';
      send.style.background = 'var(--accent)'; send.style.color = '#fff'; send.textContent = '发布';
      send.addEventListener('click', function () {
        var v = ta.value.trim();
        if (!v) { toast('批注内容不能为空'); return; }
        sendComment(sel, v);
        composerSlot.innerHTML = '';
        state.lastSel = null;
      });
      actions.appendChild(cancel); actions.appendChild(send);
      box.appendChild(q); box.appendChild(ta); box.appendChild(actions);
      composerSlot.appendChild(box);
      setTimeout(function () { ta.focus(); }, 320);
    } else {
      var hint = document.createElement('div');
      hint.className = 'empty-tip';
      hint.style.padding = '20px 16px';
      hint.style.background = 'var(--bg-sunken)';
      hint.style.borderRadius = '12px';
      hint.style.marginBottom = '12px';
      hint.style.fontSize = '13.5px';
      hint.textContent = '请先在正文里选中一段文字，再点这里添加批注。';
      composerSlot.appendChild(hint);
    }

    renderComments();
    openSheet(sheetComment);
  }

  function openSheet(el) { closeSheet(); activeSheet = el; scrim.classList.add('show'); el.classList.add('show'); }
  function closeSheet() {
    if (activeSheet) { activeSheet.classList.remove('show'); activeSheet = null; }
    scrim.classList.remove('show');
  }

  function updateSharePanel() {
    var online = collab.ready;
    var n = (state.peers || []).length;
    shareStatus.classList.toggle('online', online);
    if (!state.room) {
      shareStatusText.innerHTML = '未开启协作<small>生成链接后，任何拿到链接的人都能一起编辑</small>';
      shareLinkWrap.style.display = 'none';
      btnCreateRoom.style.display = '';
    } else {
      shareStatusText.innerHTML = (online ? '协作已开启' : '正在连接…') + '<small>' + (n > 1 ? n + ' 人正在编辑' : '等待他人加入') + '</small>';
      shareLinkWrap.style.display = '';
      btnCreateRoom.style.display = 'none';
      shareLinkInput.value = buildShareUrl();
    }
    shareHint.innerHTML = CONFIG.SERVER
      ? '链接有效期与你的服务器存储策略一致。打开链接的人可以实时看到你的输入，并添加批注。<br><br>两人可以同时在不同位置编辑，互不覆盖。'
      : '当前为<strong>本地演示模式</strong>：同一浏览器的多个标签页之间可以实时同步。';
  }

  function buildShareUrl() {
    var u = new URL(window.location.href);
    u.searchParams.set('room', state.room);
    u.hash = '';
    return u.toString();
  }

  function createRoom() {
    var room = randId(10);
    if (CONFIG.SERVER) {
      var base = CONFIG.SERVER.replace(/\/+$/, '');
      fetch(base + '/api/doc/' + room, { method: 'GET' }).catch(function () {})
        .then(function () { connectRoom(room); updateSharePanel(); afterRoomReady(room); });
      return;
    }
    connectRoom(room); updateSharePanel(); afterRoomReady(room);
  }

  function afterRoomReady(room) {
    try {
      var u = new URL(window.location.href);
      u.searchParams.set('room', room);
      history.replaceState(null, '', u.toString());
    } catch (e) {}
    toast('协作已开启，把链接发给朋友吧');
  }

  /* ============================================================
     Word 导出
     ============================================================ */
  function bodyPt() { return Math.round(Math.min(16, Math.max(10.5, typo.size * 0.62)) * 2); }
  function lineTwips() { return Math.round(360 * typo.lh * (typo.size / 19)); }

  function parseRuns(text, base) {
    var docx = window.docx;
    var fontName = getFont(typo.font).doc;
    var runs = [];
    var re = /(\*\*[^*]+\*\*|__[^_]+__|`[^`]+`|\*[^*]+\*|_[^_]+_|~~[^~]+~~)/g;
    var last = 0, m;
    var colorHex = (typo.fg || '#222222').replace('#', '').toUpperCase();
    function mk(t, extra) {
      var o = { text: t, font: fontName, size: (base && base.size) || bodyPt(), color: colorHex };
      if (base) { for (var k in base) if (k !== 'size') o[k] = base[k]; }
      if (extra) { for (var k2 in extra) o[k2] = extra[k2]; }
      return new docx.TextRun(o);
    }
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) runs.push(mk(text.slice(last, m.index)));
      var tok = m[0];
      if (/^\*\*/.test(tok) || /^__/.test(tok)) runs.push(mk(tok.slice(2, -2), { bold: true }));
      else if (/^`/.test(tok)) runs.push(mk(tok.slice(1, -1), { font: 'Consolas' }));
      else if (/^~~/.test(tok)) runs.push(mk(tok.slice(2, -2), { strike: true }));
      else runs.push(mk(tok.slice(1, -1), { italics: true }));
      last = m.index + tok.length;
    }
    if (last < text.length) runs.push(mk(text.slice(last)));
    if (!runs.length) runs.push(mk(''));
    return runs;
  }

  function buildDocx(text, title) {
    var docx = window.docx;
    var P = docx.Paragraph, HL = docx.HeadingLevel;
    var fontName = getFont(typo.font).doc;
    var lines = String(text).split(/\r?\n/);
    var kids = [], inCode = false, buf = [];
    var pt = bodyPt(), lt = lineTwips();
    var colorHex = (typo.fg || '#222222').replace('#', '').toUpperCase();

    if (title && title.trim()) {
      kids.push(new P({
        children: [new docx.TextRun({ text: title.trim(), font: fontName, size: 36, bold: true, color: colorHex })],
        spacing: { after: 320, line: lt }
      }));
    }

    for (var i = 0; i < lines.length; i++) {
      var L = lines[i], m;

      if (/^\s*```/.test(L)) {
        if (inCode) {
          buf.forEach(function (cl) {
            kids.push(new P({
              children: [new docx.TextRun({ text: cl || ' ', font: 'Consolas', size: 20 })],
              spacing: { line: 260 }, shading: { fill: 'F5F5F5' }
            }));
          });
          buf = []; inCode = false;
        } else { inCode = true; }
        continue;
      }
      if (inCode) { buf.push(L); continue; }
      if (!L.trim()) { kids.push(new P({ children: [], spacing: { after: 120 } })); continue; }

      m = L.match(/^(#{1,6})\s+(.*)$/);
      if (m) {
        var lv = m[1].length;
        var lvls = [HL.HEADING_1, HL.HEADING_2, HL.HEADING_3, HL.HEADING_4, HL.HEADING_5, HL.HEADING_6];
        kids.push(new P({
          heading: lvls[lv - 1],
          children: parseRuns(m[2], { size: lv === 1 ? 36 : (lv === 2 ? 30 : 26) }),
          spacing: { before: 240, after: 120, line: lt }
        }));
        continue;
      }

      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(L)) {
        kids.push(new P({
          text: '',
          border: { bottom: { style: 'single', size: 6, color: 'DDD8CE', space: 1 } },
          spacing: { before: 160, after: 160 }
        }));
        continue;
      }

      m = L.match(/^\s*[-*+]\s+(.*)$/);
      if (m) { kids.push(new P({ bullet: { level: 0 }, children: parseRuns(m[1]), spacing: { after: 80, line: lt } })); continue; }

      m = L.match(/^\s*\d+[.)]\s+(.*)$/);
      if (m) { kids.push(new P({ numbering: { reference: 'ol', level: 0 }, children: parseRuns(m[1]), spacing: { after: 80, line: lt } })); continue; }

      m = L.match(/^\s*>\s?(.*)$/);
      if (m) {
        kids.push(new P({
          children: parseRuns(m[1], { italics: true }),
          indent: { left: 480 },
          border: { left: { style: 'single', size: 12, color: 'DDD8CE', space: 8 } },
          spacing: { after: 120, line: lt }
        }));
        continue;
      }

      var opts = { children: parseRuns(L), spacing: { after: 160, line: lt } };
      if (typo.indent) opts.indent = { firstLine: Math.round(pt * 20) };
      kids.push(new P(opts));
    }

    var doc = new docx.Document({
      creator: '宫花红',
      title: title || '未命名',
      styles: {
        default: {
          document: {
            run: { font: fontName, size: pt, color: colorHex },
            paragraph: { spacing: { line: lt, after: 160 } }
          }
        }
      },
      numbering: {
        config: [{ reference: 'ol', levels: [{ level: 0, format: 'decimal', text: '%1.', alignment: 'start' }] }]
      },
      sections: [{
        properties: {
          page: {
            size: { width: 11906, height: 16838 },
            margin: { top: 1440, right: 1440, bottom: 1440, left: 1440 }
          }
        },
        children: kids
      }]
    });

    return docx.Packer.toBlob(doc);
  }

  function buildLegacyDoc(text, title, filename) {
    var fontName = getFont(typo.font).doc;
    var pt = Math.min(16, Math.max(10.5, typo.size * 0.62)).toFixed(1);
    var indent = typo.indent ? 'text-indent:2em;' : '';
    var fg = typo.fg || '#222222';

    var html =
      '<html xmlns:o="urn:schemas-microsoft-com:office:office" ' +
      'xmlns:w="urn:schemas-microsoft-com:office:word" ' +
      'xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8">' +
      '<title>' + esc(title || '文章') + '</title>' +
      '<style>@page{size:A4;margin:2.5cm}' +
      'body{font-family:"' + fontName + '",SimSun,serif;font-size:' + pt + 'pt;' +
      'line-height:' + typo.lh + ';color:' + fg + '}' +
      'h1,h2,h3,h4,h5,h6{font-family:inherit;font-weight:bold}' +
      'p{' + indent + '}' +
      'blockquote{border-left:3px solid #ddd8ce;padding-left:12px;color:#8c877d}' +
      'pre{background:#f5f5f5;padding:10px;font-family:Consolas,monospace;font-size:10.5pt}' +
      'code{font-family:Consolas,monospace;background:#f1f3ee;padding:1px 3px}' +
      'hr{border:0;border-top:1px solid #ddd8ce}</style></head><body>' +
      (title && title.trim() ? '<h1 style="font-size:18pt">' + esc(title.trim()) + '</h1>' : '') +
      md(text) + '</body></html>';

    return {
      blob: new Blob(['\ufeff', html], { type: 'application/msword' }),
      filename: filename.replace(/\.docx$/, '.doc')
    };
  }

  function buildWordFile(text, title) {
    var filename = (title && title.trim() ? title.trim().slice(0, 30) : '未命名') + '-' + stamp() + '.docx';
    if (window.docx && window.docx.Packer) {
      return buildDocx(text, title).then(function (blob) {
        return { blob: blob, filename: filename };
      }).catch(function () { return buildLegacyDoc(text, title, filename); });
    }
    return Promise.resolve(buildLegacyDoc(text, title, filename));
  }

  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  function exportWord() {
    var text = editor.value;
    if (!text.trim()) { toast('还没有内容可以导出'); return; }
    toast('正在生成 Word…');
    buildWordFile(text, titleInput.value).then(function (r) {
      downloadBlob(r.blob, r.filename);
      toast('已导出 ' + r.filename);
    }).catch(function () { toast('导出失败，请重试'); });
  }

  /* ============================================================
     文件读取 / 背景图 / 头像
     ============================================================ */
  function readFile(file) {
    if (!file) return;
    var name = (file.name || '').toLowerCase();
    var isText = /\.(txt|md|markdown|text|json|csv|html?|xml|log|js|css)$/.test(name) || (file.type && file.type.indexOf('text') === 0);
    if (!isText && !confirm('“' + file.name + '”可能不是纯文本，仍要尝试读取吗？')) return;
    var reader = new FileReader();
    reader.onload = function () {
      var c = String(reader.result || '');
      if (editor.value.trim()) {
        var append = confirm('已载入：' + file.name + '\n\n「确定」= 追加到末尾\n「取消」= 替换当前内容');
        editor.value = append ? editor.value.replace(/\s*$/, '') + '\n\n' + c : c;
      } else {
        editor.value = c;
      }
      countText(); scheduleLocalSave(); schedulePush();
      editor.scrollTop = 0;
      toast('已载入：' + file.name);
    };
    reader.onerror = function () { toast('读取失败，请重试'); };
    reader.readAsText(file, 'UTF-8');
  }

  function loadBgImage(file) {
    if (!file) return;
    if (!/^image\//.test(file.type)) { toast('请选择图片文件'); return; }
    if (file.size > 3 * 1024 * 1024) { toast('图片太大（建议小于 3MB）'); return; }
    var reader = new FileReader();
    reader.onload = function () {
      typo.bgImage = String(reader.result || '');
      applyTypo(); saveTypo();
      toast('背景图片已设置');
    };
    reader.onerror = function () { toast('图片读取失败'); };
    reader.readAsDataURL(file);
  }

  function loadAvatar(file) {
    if (!file) return;
    if (!/^image\//.test(file.type)) { toast('请选择图片文件'); return; }
    if (file.size > 400 * 1024) { toast('头像太大（建议小于 400KB）'); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var dataUrl = String(reader.result || '');

      /* 用小画布压到 128×128 的方形，减小存储体积 */
      var img = new Image();
      img.onload = function () {
        try {
          var size = 128;
          var canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          var ctx = canvas.getContext('2d');
          var s = Math.min(img.width, img.height);
          var sx = (img.width - s) / 2;
          var sy = (img.height - s) / 2;
          ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
          var out = canvas.toDataURL('image/jpeg', 0.85);
          user.avatar = out;
        } catch (e) {
          user.avatar = dataUrl;
        }
        saveUser();
        renderAvatarButton();
        renderAvatarPreview();
        updateSelfName();
        renderComments();
        if (isReading) renderReader();
        toast('头像已更新');
      };
      img.onerror = function () { toast('图片解析失败'); };
      img.src = dataUrl;
    };
    reader.onerror = function () { toast('头像读取失败'); };
    reader.readAsDataURL(file);
  }

  /* ============================================================
     事件绑定
     ============================================================ */
  editor.addEventListener('input', function () {
    countText();
    scheduleLocalSave();
    schedulePush();
    notifyTyping();
  });

  editor.addEventListener('select', function () {
    state.lastSel = { start: editor.selectionStart, end: editor.selectionEnd };
  });
  editor.addEventListener('mouseup', function () {
    state.lastSel = { start: editor.selectionStart, end: editor.selectionEnd };
  });
  editor.addEventListener('touchend', function () {
    setTimeout(function () {
      state.lastSel = { start: editor.selectionStart, end: editor.selectionEnd };
    }, 50);
  });
  editor.addEventListener('keyup', function (e) {
    if (e.shiftKey || e.key === 'Shift' || e.key === 'ArrowLeft' || e.key === 'ArrowRight' ||
        e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'Home' || e.key === 'End') {
      state.lastSel = { start: editor.selectionStart, end: editor.selectionEnd };
    }
  });

  editor.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      var s = this.selectionStart, t = this.selectionEnd;
      this.value = this.value.slice(0, s) + '  ' + this.value.slice(t);
      this.selectionStart = this.selectionEnd = s + 2;
      countText(); scheduleLocalSave(); schedulePush();
    }
  });

  editor.addEventListener('focus', function () {
    if (skipFocusToEnd) return;
    setTimeout(function () {
      if (skipFocusToEnd) return;
      var len = editor.value.length;
      editor.setSelectionRange(len, len);
    }, 60);
  });

  var pushThrottle = null;
  titleInput.addEventListener('input', function () {
    scheduleLocalSave();
    clearTimeout(pushThrottle);
    pushThrottle = setTimeout(pushTitle, 300);
  });

  $('toolFont').addEventListener('click', function () { openSheet(sheetFont); });
  $('toolComment').addEventListener('click', openCommentSheet);
  $('toolShare').addEventListener('click', function () { updateSharePanel(); openSheet(sheetShare); });
  $('toolExport').addEventListener('click', exportWord);
  $('btnMenu').addEventListener('click', function () { openSheet(sheetMenu); });

  scrim.addEventListener('click', closeSheet);
  var closers = document.querySelectorAll('[data-close]');
  for (var ci = 0; ci < closers.length; ci++) closers[ci].addEventListener('click', closeSheet);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeSheet(); return; }
    var mod = e.ctrlKey || e.metaKey;
    if (mod && (e.key === 's' || e.key === 'S')) { e.preventDefault(); persistLocal(); toast('已保存到本机'); }
  });

  rangeSize.addEventListener('input', function () { typo.size = parseInt(this.value, 10) || DEFAULT_TYPO.size; applyTypo(); saveTypo(); });
  $('sizeMinus').addEventListener('click', function () { typo.size = Math.max(MIN_SIZE, typo.size - 1); applyTypo(); saveTypo(); });
  $('sizePlus').addEventListener('click', function () { typo.size = Math.min(MAX_SIZE, typo.size + 1); applyTypo(); saveTypo(); });
  rangeLh.addEventListener('input', function () { typo.lh = parseFloat(this.value) || DEFAULT_TYPO.lh; applyTypo(); saveTypo(); });
  swIndent.addEventListener('click', function () { typo.indent = !typo.indent; applyTypo(); saveTypo(); });
  $('btnResetTypo').addEventListener('click', function () {
    typo = Object.assign({}, DEFAULT_TYPO);
    applyTypo(); saveTypo();
    toast('已恢复默认设置');
  });

  $('btnBgImage').addEventListener('click', function () { bgImageInput.click(); });
  $('btnBgClear').addEventListener('click', function () {
    if (!typo.bgImage) { toast('当前没有图片背景'); return; }
    typo.bgImage = '';
    applyTypo(); saveTypo();
    toast('已清除图片背景');
  });
  bgImageInput.addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    loadBgImage(f);
    e.target.value = '';
  });
  if (rangeVeil) {
    rangeVeil.addEventListener('input', function () {
      typo.bgVeil = parseInt(this.value, 10) || 0;
      applyTypo(); saveTypo();
    });
  }

  /* 我的资料面板 */
  btnAvatar.addEventListener('click', function () {
    renderAvatarPreview();
    openSheet(sheetUser);
  });
  $('miUser').addEventListener('click', function () {
    closeSheet();
    setTimeout(function () {
      renderAvatarPreview();
      openSheet(sheetUser);
    }, 220);
  });
  $('btnUploadAvatar').addEventListener('click', function () { avatarInput.click(); });
  $('btnClearAvatar').addEventListener('click', function () {
    if (!user.avatar) { toast('当前没有头像'); return; }
    user.avatar = '';
    saveUser();
    renderAvatarButton();
    renderAvatarPreview();
    updateSelfName();
    renderComments();
    if (isReading) renderReader();
    toast('已清除头像');
  });
  avatarInput.addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    loadAvatar(f);
    e.target.value = '';
  });
  $('btnSaveUser').addEventListener('click', function () {
    var v = (userNameInput.value || '').trim();
    user.name = v.slice(0, 16);
    saveUser();
    renderAvatarButton();
    updateSelfName();
    renderComments();
    if (isReading) renderReader();
    toast('资料已保存');
    closeSheet();
  });

  /* 分享面板 */
  btnCreateRoom.addEventListener('click', createRoom);
  btnCopyLink.addEventListener('click', function () { copyToClipboard(shareLinkInput.value, '链接已复制，发给朋友即可'); });
  shareLinkInput.addEventListener('click', function () { this.select(); });

  /* 更多菜单 */
  $('miCopy').addEventListener('click', function () {
    closeSheet();
    if (!editor.value) { toast('还没有内容'); return; }
    copyToClipboard(editor.value, '已复制全文');
  });
  $('miImport').addEventListener('click', function () { closeSheet(); fileInput.click(); });
  $('miHelp').addEventListener('click', function () {
    closeSheet();
    setTimeout(function () {
      alert(
        '宫花红 · 使用说明\n\n' +
        '【模式】\n右上角「阅读 / 编辑」按钮切换模式。\n阅读模式下，正文会排版显示，并内联展示所有批注。\n\n' +
        '【资料】\n点右上角头像可以设置昵称和头像，协作时对方能看到。\n\n' +
        '【写作】\n点顶栏中间可以改标题；所有内容自动存在本机。\n\n' +
        '【排版】\n点底部「字体」可以换正文字体、字号、行距、首行缩进、\n背景色、文字颜色，也可以上传图片当背景。\n还能单独设置批注的字体与颜色。\n\n' +
        '【批注】\n先在正文里选中一段文字，再点底部「批注」，就能写意见。\n批注会以比正文小一号的字体，显示在被批注段落下方。\n\n' +
        '【协作】\n点底部「分享」生成链接，把链接发给朋友，\n对方打开就能和你同时编辑。两人可以在不同位置同时打字，互不覆盖。\n\n' +
        '【导出】\n点底部「导出」保存为 Word 文档。'
      );
    }, 220);
  });
  $('miClear').addEventListener('click', function () {
    closeSheet();
    if (!editor.value) { toast('已经是空的了'); return; }
    setTimeout(function () {
      if (confirm('确定清空正文吗？此操作不可撤销。')) {
        editor.value = '';
        countText(); scheduleLocalSave(); schedulePush();
        if (isReading) renderReader();
        toast('已清空');
      }
    }, 220);
  });

  fileInput.addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    readFile(f); e.target.value = '';
  });

  ['dragover', 'drop'].forEach(function (ev) {
    document.addEventListener(ev, function (e) { e.preventDefault(); });
  });
  document.addEventListener('drop', function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) readFile(f);
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { persistLocal(); pushContent(); }
  });
  window.addEventListener('beforeunload', persistLocal);

  /* ============================================================
     初始化
     ============================================================ */
  (function init() {
    loadUser();
    initSelf();
    loadTypo();
    buildFontList();
    buildNoteFontList();
    buildSwatches(bgSwatches, BG_COLORS, 'bg');
    buildSwatches(fgSwatches, FG_COLORS, 'fg');
    buildSwatches(noteSwatches, NOTE_COLORS, 'noteColor');
    renderAvatarButton();
    renderAvatarPreview();
    applyTypo();
    renderComments();

    var room = '';
    try { room = new URL(window.location.href).searchParams.get('room') || ''; } catch (e) {}

    if (room && /^[A-Za-z0-9_-]{4,32}$/.test(room)) {
      connectRoom(room);
      updateSharePanel();
    } else {
      try {
        var raw = localStorage.getItem(LOCAL_KEY);
        if (raw) {
          var o = JSON.parse(raw);
          if (o) {
            if (typeof o.title === 'string') titleInput.value = o.title;
            if (typeof o.content === 'string') editor.value = o.content;
          }
        }
      } catch (e) {}
      countText();
      updateSharePanel();
    }

    if (window.innerWidth >= 720) {
      editor.focus();
      editor.setSelectionRange(editor.value.length, editor.value.length);
    }
  })();

})();
</script>
</body>
</html>
