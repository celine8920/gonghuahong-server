<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FCFAF6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="宫花红">
<link rel="manifest" href="manifest.json">
<title>宫花红</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
<style>
*{box-sizing:border-box}
:root{--bg:#FCFAF6;--tx:#222;--t2:#8C877D;--ln:#EAE5DB;--ac:#4A8B6F;--pop:#fff;--fs:19px;--lh:1.9;--ff:"LXGW WenKai Screen",serif;--nf:serif;--nc:#8C6E4F;--id:0;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{height:calc(52px + var(--st));padding:var(--st) 6px 0;display:flex;align-items:center;gap:4px;flex:none}
.top input{flex:1;min-width:0;border:0;outline:0;background:none;text-align:center;font:500 17px var(--ff);color:var(--tx)}
.ib{width:40px;height:40px;font-size:20px;color:var(--t2)}
.pill{height:32px;padding:0 12px;border-radius:16px;background:var(--ln);color:var(--t2);font-size:13px}
.pill.on{color:var(--ac)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;color:#fff;font-style:normal;font-size:12px;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
#fb{display:none;gap:6px;padding:6px 10px;flex-wrap:wrap;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);flex:none}
#fb.on{display:flex}
#fb input{flex:1 1 90px;min-width:0;height:34px;border:1px solid var(--ln);border-radius:8px;padding:0 8px;background:var(--pop)}
#fb button{height:34px;padding:0 10px;border-radius:8px;background:var(--ln);font-size:13px}
#fn{font-size:12px;color:var(--t2);align-self:center}
.wrap{flex:1;min-height:0;position:relative;display:flex;justify-content:center}
#ed,#rd{width:100%;max-width:760px;height:100%;padding:14px 22px 80px;font:var(--fs)/var(--lh) var(--ff);letter-spacing:.02em;overflow-y:auto}
#ed{border:0;outline:0;resize:none;background:none;color:var(--tx);text-indent:var(--id)}
#rd{display:none;word-wrap:break-word}
body.rm #ed{display:none}body.rm #rd{display:block}body.rm .pst{display:none}
::selection{background:rgba(66,133,244,.35)}
#rd p{margin:0 0 1em;text-indent:var(--id)}#rd .li{padding-left:1.2em;text-indent:0}
#rd h1,#rd h2,#rd h3{margin:1.4em 0 .6em;line-height:1.4}
#rd h1{font-size:1.5em}#rd h2{font-size:1.3em}#rd h3{font-size:1.12em}
#rd blockquote{margin:1em 0;padding-left:14px;border-left:3px solid var(--ln);color:var(--t2)}
#rd code{background:var(--ln);padding:.1em .35em;border-radius:4px;font-size:.88em}
#rd pre{background:var(--ln);padding:12px;border-radius:8px;overflow-x:auto}
#rd hr{border:0;border-top:1px solid var(--ln)}#rd a{color:var(--ac)}
.ic{margin:-.3em 0 1.1em;padding:9px 13px;border-left:3px solid var(--ac);background:rgba(74,139,111,.1);border-radius:8px;font:calc(var(--fs) - 2px)/1.75 var(--nf);color:var(--nc);text-indent:0}
.ic.rs{opacity:.45}.ih{display:flex;align-items:center;gap:6px;font-weight:600;font-size:.9em}
.cb,.ir{white-space:pre-wrap}.ir{margin-top:4px;padding-left:10px;border-left:2px solid var(--ln)}
#ct{position:absolute;right:8px;bottom:6px;font-size:12px;color:var(--t2);padding:6px 8px}
.tb{height:calc(56px + var(--sb));padding-bottom:var(--sb);display:flex;border-top:1px solid var(--ln);flex:none}
.tb button{flex:1;font-size:11px;color:var(--t2);position:relative}
.tb b{display:block;font-size:19px;font-weight:400;color:var(--tx)}
#bdg{position:absolute;top:6px;left:54%;min-width:15px;height:15px;border-radius:8px;background:#C25B4E;color:#fff;font-size:10px;line-height:15px}
#bar{position:fixed;left:50%;top:calc(58px + var(--st));transform:translateX(-50%);z-index:30;display:none;background:#2b2b2f;border-radius:10px;overflow:hidden}
#bar.on{display:flex}#bar button{color:#fff;height:38px;padding:0 15px;font-size:14px}#bar button+button{border-left:1px solid #ffffff26}
#sc{position:fixed;inset:0;background:rgba(30,25,15,.38);opacity:0;pointer-events:none;transition:.2s;z-index:60}
#sc.on{opacity:1;pointer-events:auto}
#sh{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--pop);border-radius:18px 18px 0 0;max-height:85dvh;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .28s;padding-bottom:var(--sb)}
#sh.on{transform:none}
.hd{display:flex;align-items:center;padding:10px 8px 4px 18px}.hd b{flex:1;font-size:16px}
#sb{overflow-y:auto;padding:4px 16px 20px}
@media(min-width:720px){#sh{left:50%;right:auto;bottom:auto;top:50%;width:460px;border-radius:18px;transform:translate(-50%,-46%);opacity:0;pointer-events:none}#sh.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}}
.pb{display:block;width:100%;height:44px;border-radius:12px;background:var(--ac);color:#fff;margin:8px 0}.pb.g{background:var(--ln);color:var(--tx)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:12px;cursor:pointer}.row.cu{background:rgba(74,139,111,.12)}
.row button{color:var(--ac);font-size:13px;flex:none}.nm{font-size:15px}small{color:var(--t2);font-size:12px}
.tip{color:var(--t2);font-size:13px;line-height:1.8;text-align:center;margin:10px 0}
h4{margin:16px 0 8px;font-size:12px;color:var(--t2)}.cl{display:flex;flex-wrap:wrap;gap:8px}
.ch{height:36px;padding:0 14px;border-radius:18px;background:var(--ln);border:2px solid transparent}.ch.on,.sw.on{border-color:var(--ac)}
.sw{width:40px;height:32px;border-radius:8px;border:2px solid var(--ln)}
input[type=range]{width:100%}
.pv{border:1px solid var(--ln);border-radius:10px;padding:12px;font:var(--fs)/var(--lh) var(--ff);margin-top:14px}
blockquote{margin:0 0 8px;padding-left:10px;border-left:3px solid var(--ln);color:var(--t2);font-size:13px}
.cp,.cc{border:1px solid var(--ln);border-radius:14px;padding:12px;margin:10px 0}.cp{border-color:var(--ac)}.cc.rs{opacity:.5}
.cp textarea,#sb>input{width:100%;border:0;outline:0;background:none;min-height:60px;resize:none}#sb>input{border:1px solid var(--ln);border-radius:10px;height:44px;padding:0 12px;min-height:0;margin:10px 0}
.rr{display:flex;gap:6px;margin-top:8px}.rr input{flex:1;min-width:0;height:34px;border:1px solid var(--ln);border-radius:8px;padding:0 8px;background:none}
.rr button,.ac button{color:var(--ac);font-size:13px;padding:0 8px}.ac{display:flex;justify-content:flex-end;margin-top:4px}
.pr{display:flex;align-items:center;gap:16px}.pr .pb{margin:4px 0;width:140px}
#tt{position:fixed;left:50%;bottom:calc(84px + var(--sb));transform:translateX(-50%);background:#26221ae6;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:200}#tt.on{opacity:1}
</style></head><body>
<div class="app">
<header class="top"><button class="ib" id="bl" aria-label="我的文稿">☰</button><input id="ti" placeholder="无标题" maxlength="80" aria-label="标题"><button class="pill" id="bm">阅读</button><button class="ib" id="ba" aria-label="我的资料"></button></header>
<div id="fb"><input id="fq" placeholder="查找"><input id="fr" placeholder="替换为"><button id="fp">↑</button><button id="fd">↓</button><button id="f1">替换</button><button id="fa">全部替换</button><button id="fx">✕</button><span id="fn"></span></div>
<div class="wrap"><textarea id="ed" spellcheck="false" placeholder="开始写点什么…"></textarea><div id="rd"></div><button id="ct">0 字</button></div>
<nav class="tb"><button id="tF"><b>Aa</b>字体</button><button id="tC"><b>✎</b>批注<i id="bdg" style="display:none;font-style:normal"></i></button><button id="tS"><b>⌕</b>查找</button><button id="tH"><b>⟲</b>历史</button><button id="tE"><b>⇩</b>导出</button></nav>
</div>
<div id="bar"><button data-a="copy">复制</button><button class="pst" data-a="paste">粘贴</button><button data-a="all">全选</button><button data-a="note">批注</button></div>
<div id="sc"></div><section id="sh" role="dialog" aria-modal="true"><div class="hd"><b id="shT"></b><button class="ib" id="sx" aria-label="关闭">✕</button></div><div id="sb"></div></section>
<input type="file" id="fi" hidden accept=".txt,.md,.markdown,text/*"><input type="file" id="ai" hidden accept="image/*"><div id="tt"></div>
<script>
(()=>{
const $=i=>document.getElementById(i),S=localStorage;
const get=(k,d)=>{try{const v=JSON.parse(S.getItem(k));return v==null?d:v}catch(e){return d}};
const put=(k,v)=>{try{S.setItem(k,JSON.stringify(v))}catch(e){toast('存储空间不足')}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,10),cnt=t=>t.replace(/\s/g,'').length,pad=n=>(n<10?'0':'')+n;
const ft=t=>{const d=new Date(t),n=new Date();return(d.toDateString()===n.toDateString()?'':(d.getMonth()+1)+'月'+d.getDate()+'日 ')+pad(d.getHours())+':'+pad(d.getMinutes())};
const plain=s=>String(s).replace(/[*_`~#>\[\]()]/g,'').replace(/\s+/g,'');
const safe=a=>/^data:image\/(png|jpe?g|webp);base64,/.test(a||'')?a:'';
const FONTS={lxgw:'"LXGW WenKai Screen","LXGW WenKai",serif',song:'"宋体",SimSun,"Songti SC",serif',kai:'"楷体",KaiTi,"Kaiti SC",serif',hei:'"PingFang SC","Microsoft YaHei",sans-serif'};
const NM={lxgw:'霞鹜文楷',song:'宋体',kai:'楷体',hei:'黑体'},DOCF={lxgw:'LXGW WenKai',song:'宋体',kai:'楷体',hei:'黑体'};
const BGS=['#FFFFFF','#FCFAF6','#F5EDD8','#EAF1EA','#E9EDF2','#2A2A2E'],NCS=['#8C6E4F','#666666','#3A5573','#9C4A4A','#3F6B55','#6B4E6B'];
const DEF={size:19,lh:1.9,font:'lxgw',bg:'#FCFAF6',nf:'song',nc:'#8C6E4F',indent:false};
const cfg=Object.assign({},DEF,get('gh.cfg',{}));
let docs=get('gh.docs',[]),cur=S.getItem('gh.cur'),user=get('gh.user',{name:'',avatar:''}),reading=false,st={q:''},tm;
let cid=S.getItem('gh.cid');if(!cid){cid=rid();S.setItem('gh.cid',cid)}
const blank=()=>({id:rid(),title:'',content:'',comments:[],updated:Date.now()});
if(!docs.length){const o=get('writer.local.v2',null);docs=[Object.assign(blank(),o?{title:o.title||'',content:o.content||''}:{})]}
if(!docs.find(d=>d.id===cur))cur=docs[0].id;
const doc=()=>docs.find(d=>d.id===cur),me=()=>user.name||'访客'+cid.slice(-3).toUpperCase();
const ed=$('ed'),rd=$('rd'),ti=$('ti'),ct=$('ct'),fb=$('fb'),bar=$('bar'),sh=$('sh'),sc=$('sc'),sb=$('sb');
let tt;function toast(m){const e=$('tt');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2000)}
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return'hsl('+h+',38%,48%)'};
const ava=(o,s)=>{const a=safe(o.avatar);return`<i class="av" style="width:${s}px;height:${s}px;background:${hue(o.author)}">${a?`<img src="${a}" alt="">`:esc((o.author||'?').trim()[0]||'?')}</i>`};
const paintTop=()=>{$('ba').innerHTML=ava({author:me(),avatar:user.avatar},32)};

/* ---------- 外观 ---------- */
const lum=h=>{const n=parseInt(h.slice(1),16);return(.2126*(n>>16)+.7152*((n>>8)&255)+.0722*(n&255))/255};
function apply(){const r=document.documentElement.style,dk=lum(cfg.bg)<.45;
 [['--bg',cfg.bg],['--tx',dk?'#E6E2D8':'#222'],['--t2',dk?'#9a968c':'#8C877D'],['--ln',dk?'#46464b':'#EAE5DB'],['--pop',dk?'#35353a':'#fff'],['--ac',dk?'#7CC4A0':'#4A8B6F'],['--fs',cfg.size+'px'],['--lh',cfg.lh],['--ff',FONTS[cfg.font]],['--nf',FONTS[cfg.nf]],['--nc',cfg.nc],['--id',cfg.indent?'2em':'0']].forEach(x=>r.setProperty(x[0],x[1]));
 document.querySelector('meta[name=theme-color]').content=cfg.bg}

/* ---------- 文稿与保存 ---------- */
const sync=()=>{const d=doc();if(d&&(d.title!==ti.value||d.content!==ed.value)){d.title=ti.value;d.content=ed.value;d.updated=Date.now()}};
function snap(force){const d=doc();if(!d||!d.content.trim())return;const k='gh.v.'+d.id,v=get(k,[]),l=v[0];
 if(l&&l.c===d.content)return;if(!force&&l&&Date.now()-l.t<18e4)return;v.unshift({t:Date.now(),c:d.content});put(k,v.slice(0,30))}
function save(){sync();put('gh.docs',docs);snap()}
const later=()=>{clearTimeout(tm);tm=setTimeout(save,600)};
function load(){const d=doc();ti.value=d.title;ed.value=d.content;ed.scrollTop=0;stat();badge();if(reading)render()}
function open(id){save();cur=id;S.setItem('gh.cur',id);load()}
function newDoc(d){save();d=d||blank();docs.unshift(d);cur=d.id;S.setItem('gh.cur',cur);put('gh.docs',docs);load();closeSheet()}

/* ---------- Markdown / 阅读 ---------- */
const inl=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>').replace(/~~([^~]+)~~/g,'<del>$1</del>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
function md(src){const o=[];let code=null,m;
 for(const L of src.split(/\r?\n/)){
  if(/^\s*```/.test(L)){if(code){o.push({h:'<pre><code>'+esc(code.join('\n'))+'</code></pre>',t:plain(code.join(''))});code=null}else code=[];continue}
  if(code){code.push(L);continue}if(!L.trim())continue;
  if(m=L.match(/^(#{1,6})\s+(.*)$/))o.push({h:`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`,t:plain(m[2])});
  else if(/^\s*(-{3,}|\*{3,})\s*$/.test(L))o.push({h:'<hr>',t:''});
  else if(m=L.match(/^\s*>\s?(.*)$/))o.push({h:'<blockquote>'+inl(m[1])+'</blockquote>',t:plain(m[1])});
  else if(m=L.match(/^\s*[-*+]\s+(.*)$/))o.push({h:'<p class="li">• '+inl(m[1])+'</p>',t:plain(m[1])});
  else o.push({h:'<p'+(/^\s*\d+[.)]\s/.test(L)?' class="li"':'')+'>'+inl(L)+'</p>',t:plain(L)})}
 if(code)o.push({h:'<pre><code>'+esc(code.join('\n'))+'</code></pre>',t:''});return o}
const cHtml=c=>`<div class="ic${c.resolved?' rs':''}" data-cid="${c.id}"><div class="ih">${ava(c,16)}<span>${esc(c.author||'匿名')}</span>${c.resolved?'<span>· 已解决</span>':''}</div><div class="cb">${esc(c.text)}</div>${(c.replies||[]).map(r=>`<div class="ir"><b>${esc(r.author)}</b>：${esc(r.text)}</div>`).join('')}</div>`;
function build(d){const bl=md(d.content),cm={};
 d.comments.forEach(c=>{const k=plain((c.quote||'').split(/\n/).find(l=>l.trim())||'');let i=bl.findIndex(b=>k&&b.t.includes(k));if(i<0)i=Math.max(0,bl.length-1);(cm[i]=cm[i]||[]).push(c)});
 return bl.map((b,i)=>b.h+(cm[i]||[]).map(cHtml).join('')).join('')||'<p>还没有内容。</p>'}
function render(){sync();rd.innerHTML=build(doc())}
function setReading(on){reading=on;document.body.classList.toggle('rm',on);$('bm').textContent=on?'编辑':'阅读';$('bm').classList.toggle('on',on);if(on){fb.classList.remove('on');render()}bar.classList.remove('on');stat()}

/* ---------- 字数 / 选区工具条 ---------- */
const selText=()=>reading?String(getSelection()):(document.activeElement===ed?ed.value.slice(ed.selectionStart,ed.selectionEnd):'');
function stat(){const s=selText();ct.textContent=(s.trim()?'选中 '+cnt(s)+' / ':'')+cnt(ed.value)+' 字'}
document.addEventListener('selectionchange',()=>{const t=selText();if(t.trim())st.q=t;bar.classList.toggle('on',!!t.trim());stat()});
['mousedown','pointerdown'].forEach(n=>bar.addEventListener(n,e=>e.preventDefault()));
function copy(t){const f=()=>{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;top:-99px';document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();toast(ok?'已复制':'复制失败')};
 navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t).then(()=>toast('已复制'),f):f()}
bar.onclick=e=>{const a=e.target.dataset.a;if(!a)return;
 if(a==='copy')copy(selText());
 else if(a==='paste'){if(!navigator.clipboard||!navigator.clipboard.readText)return toast('浏览器不支持一键粘贴，请用系统菜单');navigator.clipboard.readText().then(t=>{ed.focus();document.execCommand('insertText',false,t)}).catch(()=>toast('未获得剪贴板权限'))}
 else if(a==='all'){if(reading){const r=document.createRange();r.selectNodeContents(rd);const s=getSelection();s.removeAllRanges();s.addRange(r)}else{ed.focus();ed.select()}}
 else comments()};

/* ---------- 弹层 ---------- */
function sheet(t,h,fn){$('shT').textContent=t;sb.innerHTML=h;sb.onclick=sb.oninput=sb.onchange=fn||null;sb.onkeydown=null;sh.classList.add('on');sc.classList.add('on')}
function closeSheet(){sh.classList.remove('on');sc.classList.remove('on');st.q=''}
sc.onclick=$('sx').onclick=closeSheet;
const dl=(b,n)=>{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)};

/* 我的文稿 */
function list(){sync();const cs=docs.slice().sort((a,b)=>b.updated-a.updated);
 sheet('我的文稿（'+docs.length+'）','<button class="pb" data-a="new">＋ 新建文稿</button>'+cs.map(d=>`<div class="row${d.id===cur?' cu':''}" data-id="${d.id}" data-a="open"><div><div class="nm">${esc(d.title||'无标题')}</div><small>${cnt(d.content)} 字 · ${ft(d.updated)}</small></div><button data-a="rm">删除</button></div>`).join('')+'<button class="pb g" data-a="imp">导入文本文件为新文稿</button>',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,r=t.closest('[data-id]'),id=r&&r.dataset.id;
  if(a==='new')newDoc();else if(a==='open'){open(id);closeSheet()}else if(a==='imp'){closeSheet();$('fi').click()}
  else if(a==='rm'){const d=docs.find(x=>x.id===id);if(!confirm('删除「'+(d.title||'无标题')+'」？版本历史也会一并删除。'))return;
   sync();docs=docs.filter(x=>x.id!==id);S.removeItem('gh.v.'+id);if(!docs.length)docs.push(blank());
   if(id===cur){cur=docs[0].id;S.setItem('gh.cur',cur);load()}put('gh.docs',docs);list()}})}
$('fi').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();
 r.onload=()=>{const d=blank();d.title=f.name.replace(/\.\w+$/,'');d.content=String(r.result||'');newDoc(d);toast('已导入：'+f.name)};r.readAsText(f,'UTF-8')};

/* 批注（含回复） */
const badge=()=>{const n=doc().comments.filter(c=>!c.resolved).length,b=$('bdg');b.textContent=n>99?'99+':n;b.style.display=n?'':'none'};
function locate(c){closeSheet();if(reading){const n=rd.querySelector('.ic[data-cid="'+c.id+'"]');if(n)n.scrollIntoView({behavior:'smooth',block:'center'});return}
 const i=ed.value.indexOf(c.quote);if(i<0)return toast('原文已被修改，无法定位');
 ed.focus();ed.setSelectionRange(i,i+c.quote.length);ed.scrollTop=i/Math.max(1,ed.value.length)*(ed.scrollHeight-ed.clientHeight)}
function comments(){const d=doc(),cs=d.comments.slice().sort((a,b)=>(a.resolved?1:0)-(b.resolved?1:0)||b.t-a.t);
 const done=()=>{d.updated=Date.now();put('gh.docs',docs);badge();if(reading)render();comments()};
 sheet('批注（'+cs.filter(c=>!c.resolved).length+' 待处理）',(st.q?`<div class="cp"><blockquote>${esc(st.q.slice(0,140))}</blockquote><textarea id="cn" placeholder="写下批注…"></textarea><button class="pb" data-a="post">发布批注</button></div>`:'<p class="tip">先在正文里选中一段文字，再点「批注」添加。</p>')
  +cs.map(c=>`<div class="cc${c.resolved?' rs':''}" data-id="${c.id}">${c.quote?`<blockquote>${esc(c.quote.slice(0,100))}</blockquote>`:''}<div>${esc(c.text)}</div><small>${esc(c.author)} · ${ft(c.t)}</small>${(c.replies||[]).map(r=>`<div class="ir"><b>${esc(r.author)}</b> ${esc(r.text)} <small>${ft(r.t)}</small></div>`).join('')}<div class="rr"><input placeholder="回复…"><button data-a="reply">回复</button></div><div class="ac"><button data-a="go">定位</button><button data-a="res">${c.resolved?'重新打开':'已解决'}</button><button data-a="del">删除</button></div></div>`).join(''),e=>{
  const t=e.target.closest('[data-a]');if(!t||e.type!=='click')return;const a=t.dataset.a;
  if(a==='post'){const v=$('cn').value.trim();if(!v)return toast('批注内容不能为空');d.comments.push({id:rid(),quote:st.q,text:v,author:me(),avatar:user.avatar,t:Date.now(),resolved:false,replies:[]});st.q='';return done()}
  const r=t.closest('[data-id]'),c=d.comments.find(x=>x.id===(r&&r.dataset.id));if(!c)return;
  if(a==='reply'){const v=r.querySelector('input').value.trim();if(!v)return;(c.replies=c.replies||[]).push({id:rid(),author:me(),avatar:user.avatar,text:v,t:Date.now()});done()}
  else if(a==='res'){c.resolved=!c.resolved;done()}
  else if(a==='del'){if(confirm('删除这条批注及其回复？')){d.comments=d.comments.filter(x=>x!==c);done()}}
  else locate(c)});
 sb.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing&&e.target.placeholder==='回复…')e.target.nextElementSibling.click()}}

/* 版本历史 */
function hist(){sync();const d=doc(),v=get('gh.v.'+d.id,[]);
 sheet('版本历史','<button class="pb" data-a="mk">立即保存当前版本</button><p class="tip">自动每隔几分钟存一份快照（最多 30 份）；恢复前会先保存当前内容。</p>'+(v.map((x,i)=>`<div class="row" data-i="${i}"><div><div class="nm">${ft(x.t)} · ${cnt(x.c)} 字</div><small>${esc(x.c.replace(/\s+/g,' ').slice(0,36))}</small></div><button data-a="rs">恢复</button></div>`).join('')||'<p class="tip">暂无历史版本</p>'),e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  if(t.dataset.a==='mk'){snap(true);hist();toast('已保存版本')}
  else{const x=v[+t.closest('[data-i]').dataset.i];if(!x||!confirm('恢复到这个版本？当前内容会先存为历史版本。'))return;snap(true);ed.value=x.c;save();stat();if(reading)render();closeSheet();toast('已恢复')}})}

/* 查找替换 */
const fq=$('fq'),fr=$('fr'),fn=$('fn');
function hits(){const q=fq.value.toLowerCase();if(!q)return[];const t=ed.value.toLowerCase(),r=[];let i=-1;while((i=t.indexOf(q,i+1))>=0)r.push(i);return r}
function go(d){const h=hits(),L=fq.value.length;if(!h.length){fn.textContent='0 处';return toast('没有找到')}
 let i;if(d>0){i=h.findIndex(x=>x>=ed.selectionEnd);if(i<0)i=0}else{i=h.length-1;while(i>=0&&h[i]>=ed.selectionStart)i--;if(i<0)i=h.length-1}
 ed.focus();ed.setSelectionRange(h[i],h[i]+L);ed.scrollTop=h[i]/Math.max(1,ed.value.length)*(ed.scrollHeight-ed.clientHeight);fn.textContent=(i+1)+'/'+h.length}
const fire=()=>ed.dispatchEvent(new Event('input'));
function toggleFind(){setReading(false);fb.classList.toggle('on');if(fb.classList.contains('on')){if(st.q&&st.q.length<40&&!/\n/.test(st.q))fq.value=st.q;fq.focus()}}
fq.oninput=()=>{const n=hits().length;fn.textContent=fq.value?n+' 处':''};
$('fd').onclick=()=>go(1);$('fp').onclick=()=>go(-1);$('fx').onclick=()=>fb.classList.remove('on');$('tS').onclick=toggleFind;
fq.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)go(e.shiftKey?-1:1)};
$('f1').onclick=()=>{if(!fq.value)return;if(ed.value.slice(ed.selectionStart,ed.selectionEnd).toLowerCase()===fq.value.toLowerCase()){ed.setRangeText(fr.value,ed.selectionStart,ed.selectionEnd,'end');fire()}go(1)};
$('fa').onclick=()=>{const n=hits().length;if(!n)return toast('没有找到');sync();snap(true);
 ed.value=ed.value.replace(new RegExp(fq.value.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),()=>fr.value);fire();fq.oninput();toast('已替换 '+n+' 处')};

/* 字体与外观 */
function fonts(){const ch=(k,v,l,s)=>`<button class="ch${cfg[k]===v?' on':''}" data-k="${k}" data-v="${v}" ${s||''}>${l}</button>`,
 fl=k=>Object.keys(FONTS).map(x=>ch(k,x,NM[x],`style="font-family:${FONTS[x].replace(/"/g,'&quot;')}"`)).join(''),
 sw=(k,l)=>l.map(c=>`<button class="sw${cfg[k]===c?' on':''}" data-k="${k}" data-v="${c}" style="background:${c}" aria-label="${c}"></button>`).join('');
 sheet('字体与外观',`<h4>正文字体</h4><div class="cl">${fl('font')}</div><h4>字号 <span>${cfg.size}</span>px</h4><input type="range" data-k="size" min="14" max="36" value="${cfg.size}"><h4>行距 <span>${cfg.lh}</span></h4><input type="range" data-k="lh" min="1.4" max="2.6" step=".05" value="${cfg.lh}"><h4>首行缩进</h4><div class="cl">${ch('indent',true,'开')}${ch('indent',false,'关')}</div><h4>背景色</h4><div class="cl">${sw('bg',BGS)}</div><h4>批注字体（比正文小一号）</h4><div class="cl">${fl('nf')}</div><h4>批注颜色</h4><div class="cl">${sw('nc',NCS)}</div><div class="pv">永和九年，岁在癸丑，暮春之初，会于会稽山阴之兰亭。<div class="ic" style="margin:8px 0 0"><div class="ih">批注示例</div>批注显示在被批注的正文下方。</div></div><button class="pb g" data-a="rst">恢复默认</button>`,e=>{
  const t=e.target,a=t.dataset.a,k=t.dataset.k;
  if(a==='rst'&&e.type==='click'){Object.assign(cfg,DEF)}
  else if(!k)return;
  else if(t.type==='range'){if(e.type!=='input')return;cfg[k]=+t.value;t.previousElementSibling.firstElementChild.textContent=t.value}
  else{if(e.type!=='click')return;const v=t.dataset.v;cfg[k]=v==='true'||(v==='false'?false:v)}
  apply();put('gh.cfg',cfg);if(reading)render();if(t.type!=='range'){const y=sb.scrollTop;fonts();sb.scrollTop=y}})}

/* 字数统计 */
function stats(){const t=ed.value,r=(a,b)=>`<div class="row" style="cursor:default"><span>${a}</span><b>${b}</b></div>`,n=cnt(t);
 sheet('字数统计',r('总字数（不含空白）',n)+r('含空白字符',t.length)+r('汉字',(t.match(/[\u4e00-\u9fff]/g)||[]).length)+r('英文单词',(t.match(/[A-Za-z]+/g)||[]).length)+r('段落',t.split(/\n+/).filter(x=>x.trim()).length)+r('预计阅读',n?Math.max(1,Math.ceil(n/400))+' 分钟':'—')+r('批注',doc().comments.length+' 条')+(selText().trim()?r('当前选中',cnt(selText())+' 字'):''))}
ct.onclick=stats;

/* 导出 */
function exp(){sync();sheet('导出','<button class="pb" data-a="doc">Word 文档（含批注）</button><button class="pb g" data-a="txt">纯文本 / Markdown</button><button class="pb g" data-a="cp">复制全文</button><p class="tip">Word 沿用当前字体与行距；批注在对应段落下方，使用批注字体与颜色。</p>',e=>{
  const a=e.target.dataset.a,d=doc(),nm=(d.title.trim().slice(0,30)||'未命名')+'-'+new Date().toISOString().slice(0,10);if(!a)return;
  if(!d.content.trim())return toast('还没有内容可以导出');
  if(a==='cp'){closeSheet();copy(d.content)}
  else if(a==='txt'){dl(new Blob([d.content],{type:'text/plain;charset=utf-8'}),nm+'.txt');closeSheet()}
  else{const pt=Math.min(16,Math.max(10.5,cfg.size*.62)),css=`body{font-family:"${DOCF[cfg.font]}",SimSun,serif;font-size:${pt}pt;line-height:${cfg.lh};color:#222}p{margin:0 0 .8em;${cfg.indent?'text-indent:2em':''}}.ic{font-family:"${DOCF[cfg.nf]}",SimSun,serif;font-size:${pt-1}pt;color:${cfg.nc};border-left:3px solid #4A8B6F;padding:2px 0 2px 8px;margin:0 0 .8em}.ih{font-weight:bold}.ir{margin-left:1em}blockquote{border-left:3px solid #ddd;padding-left:10px;color:#888}`;
   const body=build(d).replace(/<i class="av"[\s\S]*?<\/i>/g,'');
   dl(new Blob(['\ufeff','<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>'+css+'</style></head><body>'+(d.title.trim()?'<h1>'+esc(d.title.trim())+'</h1>':'')+body+'</body></html>'],{type:'application/msword'}),nm+'.doc');closeSheet()}})}

/* 我的资料 */
function prof(){sheet('我的资料',`<div class="pr">${ava({author:me(),avatar:user.avatar},64)}<div><button class="pb g" data-a="up">上传头像</button><button class="pb g" data-a="cl">清除头像</button></div></div><input id="un" maxlength="16" placeholder="昵称（显示在批注里）" value="${esc(user.name)}"><button class="pb" data-a="sv">保存</button><p class="tip">昵称和头像只保存在本机浏览器。</p>`,e=>{
  const a=e.target.dataset.a;if(!a)return;
  if(a==='up')$('ai').click();
  else if(a==='cl'){user.avatar='';put('gh.user',user);paintTop();prof()}
  else{user.name=$('un').value.trim().slice(0,16);put('gh.user',user);paintTop();closeSheet();if(reading)render();toast('资料已保存')}})}
$('ai').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f||!/^image\//.test(f.type))return;const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);URL.revokeObjectURL(u);
  const n=$('un');if(n)user.name=n.value.trim().slice(0,16);user.avatar=c.toDataURL('image/jpeg',.85);put('gh.user',user);paintTop();prof();toast('头像已更新')};
 im.onerror=()=>toast('图片解析失败');im.src=u};

/* ---------- 事件 ---------- */
ed.oninput=()=>{st.q='';stat();later()};ti.oninput=later;
ed.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();document.execCommand('insertText',false,'  ')}};
$('bl').onclick=list;$('ba').onclick=prof;$('bm').onclick=()=>setReading(!reading);
$('tF').onclick=fonts;$('tC').onclick=comments;$('tH').onclick=hist;$('tE').onclick=exp;
document.addEventListener('keydown',e=>{const m=e.ctrlKey||e.metaKey;
 if(e.key==='Escape')closeSheet();
 else if(m&&e.key.toLowerCase()==='s'){e.preventDefault();save();toast('已保存')}
 else if(m&&e.key.toLowerCase()==='f'){e.preventDefault();toggleFind()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){save();snap(true)}});
addEventListener('beforeunload',save);

apply();paintTop();load();
if('serviceWorker'in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script></body></html>
